# Estado da mudança. Forma válida: plugins/sdd-kit/schemas/status.schema.json
#
# Datas SEMPRE entre aspas: sem elas o YAML produz um objeto data e a
# validação por schema falha. Ver standards.md §9.
version: 1

id: "0007-sdd-workflow-completion"
# feature | bug | refactor | change
type: "feature"
title: "Completar o fluxo SDD — clarify, design, approve, implement, verify e archive"

status: PLANNED

created: "2026-07-29"
updated: "2026-07-29"

# Histórico de transições. Só acrescenta; nunca reescreve.
history:
  - status: DRAFT
    date: "2026-07-29"
    reason: >-
      Mudança criada por /sdd-kit:new a partir da solicitação de completar o
      fluxo SDD com as seis skills restantes, a máquina de estados e a
      rastreabilidade. Rascunho inicial com 10 questões pendentes.

  - status: CLARIFIED
    date: "2026-07-29"
    reason: >-
      As três questões críticas foram resolvidas por ADR-010 (máquina de
      estados como dado único), ADR-011 (identidade e invalidação da
      aprovação) e ADR-012 (execução vazia não é aprovação). Refinamento
      feito à mão: a skill clarify, que faria este trabalho, é justamente
      uma das entregas desta mudança.

      Numa segunda passagem, ainda em CLARIFIED, as oito questões de
      prioridade alta foram respondidas: Q3, Q4 e Q11 eram a mesma decisão
      vista de ângulos diferentes e viraram ADR-013, e Q9 destravou cinco
      cenários. Restam três questões de prioridade média. Refinar não é
      transicionar — por isso a segunda passagem não gerou entrada própria
      no histórico.

  - status: DESIGNED
    date: "2026-07-29"
    reason: >-
      Design técnico escrito à mão — a skill design, que faria este trabalho,
      é uma das entregas desta mudança. Fecha Q8 (referência por identificador
      em vez de reescrita de links) e Q14 (remover a duplicação de
      architecture.md §3 em vez de sincronizá-la). Define workflow.json,
      o contrato das seis skills e a ordem de escrita. Resta Q10, que é
      trabalho de spec, não de design.

  - status: PLANNED
    date: "2026-07-29"
    reason: >-
      Plano gerado por /sdd-kit:tasks a partir de spec.md e design.md: 17
      tarefas (8 P, 9 M, nenhuma G), ordenadas por dependência, com
      traceability.yaml cobrindo os onze requisitos. Transição DESIGNED →
      PLANNED válida pelo grafo de architecture.md §3 — nenhum estado pulado.
      As duas condições que bloqueiam a promoção não se aplicam: todo
      requisito tem ao menos uma tarefa e toda dependência aponta para tarefa
      existente, sem ciclos. Duas tarefas candidatas a G foram divididas antes
      de entrar no plano — implement em TASK-SWC-010 e TASK-SWC-011, verify em
      TASK-SWC-012 e TASK-SWC-013.

      A execução anterior desta skill escreveu tasks.md e traceability.yaml e
      caiu por erro de servidor antes de atualizar status.yaml e index.yaml.
      Esta entrada completa a operação; os identificadores TASK-SWC-* e
      TEST-SWC-* daquela execução foram preservados, nenhum renumerado.

# null significa NÃO APROVADO. Preenchido por /sdd-kit:approve com
# {date, by, revision}.
approval: null

# Sem bloqueios: nenhuma questão crítica em aberto.
blocked_by: []

# Questões já resolvidas. Preservadas em vez de apagadas: uma decisão sem
# rastro é indistinguível de uma suposição — ver constitution.md, Art. 5.
resolved_questions:
  - question: Q1
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    adr: ADR-010
    summary: >-
      A máquina de estados vira dado com fonte única em schemas/workflow.json.
      O grafo já existia em três cópias manuais — architecture.md,
      tasks/SKILL.md e a constante TRANSICOES nos testes, nenhuma derivando
      das outras. REQ-SWC-007 passa a ser testável.
  - question: Q2
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    adr: ADR-011
    summary: >-
      approval.by vem de git config, mas só é gravado após ato humano
      explícito na conversa; o git dá o rótulo, a pessoa dá o ato.
      approval.revision é o SHA-256 de spec.md truncado em 12 caracteres,
      tornando a invalidação exigida pelo RF-008 mecânica em vez de
      julgamento sobre o que é "alteração importante".
  - question: Q3
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    adr: ADR-013
    summary: >-
      blocked_by e BLOCKED são conceitos distintos. O campo registra questões
      abertas em qualquer estado; o estado significa que o trabalho parou, e
      só é alcançável de IN_PROGRESS. Os artefatos deste repositório
      revelaram a distinção: 0001 passou por DESIGNED com bloqueios e nunca
      transicionou para BLOCKED, corretamente.
  - question: Q4
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    adr: ADR-013
    summary: >-
      Regresso detecta, não muta. Spec alterada após APPROVED tem hash
      divergente e a aprovação fica vencida; implement recusa avançar mas não
      regride o estado sozinho, o que seria reescrever histórico sem decisão
      humana.
  - question: Q6
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    summary: >-
      implement aceita o identificador da tarefa; sem ele, propõe a próxima
      pendente cujas dependências estejam todas concluídas e pede confirmação
      no modo guided. Havendo mais de uma elegível, lista em vez de escolher
      por ordem de identificador.
  - question: Q7
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    summary: >-
      Na Fase 2 as skills escrevem traceability.yaml diretamente, porque os
      scripts só chegam na Fase 4 por ADR-007. A contenção contra divergência
      é traceability.schema.json, que o PRD §14 lista e ainda não existe —
      criá-lo é tarefa desta mudança.
  - question: Q9
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    summary: >-
      Destravada por Q2, Q3 e Q4. Os cinco cenários dependentes foram escritos
      como SCN-SWC-018 a SCN-SWC-022.
  - question: Q11
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    adr: ADR-013
    summary: >-
      Estrutura e política são separadas. PLANNED para IN_PROGRESS existe
      sempre no grafo; require_approval decide se implement aceita. Um grafo
      que se reescreve conforme a configuração deixa de ser verificável.
  - question: Q12
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    summary: >-
      Sem atomicidade real, escolhe-se a ordem em que a falha é detectável:
      artefatos, depois status.yaml, index.yaml por último. Falha parcial
      deixa o índice atrasado, nunca apontando para o que não existe.
      TEST-PF-013 já detecta a divergência.
  - question: Q13
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    adr: ADR-012
    summary: >-
      verify pede relatório estruturado ao runner e conta os testes
      executados. Não conseguindo determinar, reporta "não foi possível
      confirmar execução", que sob require_tests true bloqueia — não
      confirmado não é aprovado.
  - question: Q8
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    summary: >-
      Mudanças passam a ser referenciadas por identificador, não por caminho.
      archive move o diretório e atualiza o índice; não reescreve Markdown,
      porque varrer o repositório reescrevendo links erra em bloco de código
      e em citação.
  - question: Q14
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    summary: >-
      architecture.md §3 deixa de conter a tabela e passa a apontar para
      workflow.json. Duplicação se resolve apagando uma cópia, não testando
      a sincronia entre as duas.
  - question: Q5
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    adr: ADR-012
    summary: >-
      verify exige evidência de execução, não código de saída. Executada sem
      efeito bloqueia quando require_tests é true. Este projeto caiu nesse
      buraco com vitest --passWithNoTests saindo 0 sem executar nada.

# Contadores derivados de tasks.md. total = pending + in_progress + done.
tasks:
  total: 17
  pending: 17
  in_progress: 0
  done: 0

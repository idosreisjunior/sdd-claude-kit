# Estado da mudança. Forma válida: plugins/sdd-kit/schemas/status.schema.json
#
# Datas SEMPRE entre aspas: sem elas o YAML produz um objeto data e a
# validação por schema falha. Ver standards.md §9.
version: 1

id: "0007-sdd-workflow-completion"
# feature | bug | refactor | change
type: "feature"
title: "Completar o fluxo SDD — clarify, design, approve, implement, verify e archive"

status: CLARIFIED

created: "2026-07-29"
updated: "2026-07-29"

# Histórico de transições. Só acrescenta; nunca reescreve.
history:
  - status: DRAFT
    date: "2026-07-29"
    reason: >-
      Mudança criada por /sdd-kit:new a partir da solicitação de completar o
      fluxo SDD com as seis skills restantes, a máquina de estados e a
      rastreabilidade. Rascunho inicial com 10 questões pendentes.

  - status: CLARIFIED
    date: "2026-07-29"
    reason: >-
      As três questões críticas foram resolvidas por ADR-010 (máquina de
      estados como dado único), ADR-011 (identidade e invalidação da
      aprovação) e ADR-012 (execução vazia não é aprovação). Refinamento
      feito à mão: a skill clarify, que faria este trabalho, é justamente
      uma das entregas desta mudança. Restam questões de prioridade alta e
      média, nenhuma crítica.

# null significa NÃO APROVADO. Preenchido por /sdd-kit:approve com
# {date, by, revision}.
approval: null

# Sem bloqueios: nenhuma questão crítica em aberto.
blocked_by: []

# Questões já resolvidas. Preservadas em vez de apagadas: uma decisão sem
# rastro é indistinguível de uma suposição — ver constitution.md, Art. 5.
resolved_questions:
  - question: Q1
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    adr: ADR-010
    summary: >-
      A máquina de estados vira dado com fonte única em schemas/workflow.json.
      O grafo já existia em três cópias manuais — architecture.md,
      tasks/SKILL.md e a constante TRANSICOES nos testes, nenhuma derivando
      das outras. REQ-SWC-007 passa a ser testável.
  - question: Q2
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    adr: ADR-011
    summary: >-
      approval.by vem de git config, mas só é gravado após ato humano
      explícito na conversa; o git dá o rótulo, a pessoa dá o ato.
      approval.revision é o SHA-256 de spec.md truncado em 12 caracteres,
      tornando a invalidação exigida pelo RF-008 mecânica em vez de
      julgamento sobre o que é "alteração importante".
  - question: Q5
    date: "2026-07-29"
    resolved_by: TASK-PF-016
    adr: ADR-012
    summary: >-
      verify exige evidência de execução, não código de saída. Executada sem
      efeito bloqueia quando require_tests é true. Este projeto caiu nesse
      buraco com vitest --passWithNoTests saindo 0 sem executar nada.

# Contadores derivados de tasks.md. total = pending + in_progress + done.
tasks:
  total: 0
  pending: 0
  in_progress: 0
  done: 0

# Itens sem cobertura automatizada, registrados explicitamente em vez de
# omitidos. Um requisito que só dá para verificar por revisão humana continua
# sendo um requisito — o que não pode é a lacuna ficar invisível.
gaps:
  - id: "SCN-SWC-021"
    reason: >-
      O cenário exige que uma mudança em qualquer estado não terminal possa
      passar a CANCELLED com o motivo registrado no histórico. Nenhuma das
      seis skills desta entrega executa cancelamento: a solicitação nomeou
      seis skills e cancel não está entre elas, e o escopo da spec proíbe
      inventar skill não pedida. A cobertura é estrutural — TEST-SWC-001
      verifica que CANCELLED é alcançável de todo estado não terminal no
      grafo — mas nenhum caminho executável produz a transição.
    mitigation: >-
      Até existir uma skill cancel, o cancelamento é edição manual de
      status.yaml, e TEST-SWC-003 verifica que a sequência resultante
      satisfaz o grafo. Abrir uma mudança própria para a skill cancel é o
      encaminhamento; registrá-la aqui evita que a lacuna passe por
      cobertura.

  - id: "TEST-SWC-010"
    reason: >-
      Os testes comportamentais — TEST-SWC-010, 011, 014, 015, 017, 018, 024,
      026, 027, 029, 031, 032 e 035 — dependem de execução real via
      `claude -p` e do CLI claude disponível na máquina. Não são testes de
      unidade e não rodam sem o binário. O design §10 os torna obrigatórios
      justamente porque teste estrutural sobre SKILL.md não pega defeito de
      comportamento: o bug 0003 passou por 201 testes verdes e só apareceu
      na execução real.
    mitigation: >-
      Cada tarefa de skill exige a execução real como critério de conclusão,
      com a saída registrada na própria seção "Resultado", como TASK-PF-002
      fez com `claude plugin validate`. É a mesma prática da Fase 1: quando o
      teste roda com a ferramenta real, isso fica escrito; quando roda com
      harness, isso também fica escrito.

  - id: "NFR-SWC-001"
    reason: >-
      "Nenhuma string voltada ao usuário escrita direto no código" é
      parcialmente automatizável. TEST-SWC-034 verifica a presença da seção
      de arquivos lidos e a ausência de glob que alcance outra mudança; não
      verifica que todo texto de usuário está em pt-BR idiomático nem que a
      camada de i18n foi usada, porque esta mudança não introduz código onde
      a camada existiria.
    mitigation: >-
      Revisão humana dos seis SKILL.md em TASK-SWC-016, com o resultado
      registrado. A verificação mecânica completa chega quando a Fase 4
      introduzir os scripts, que são onde o risco de string embutida
      realmente mora.

  - id: "Q10"
    reason: >-
      A spec deixou Q10 aberta com prioridade média: se existem NFRs
      específicos desta mudança além dos três herdados dos padrões do projeto.
      O design §15 registra que acrescentar requisito é trabalho de spec, não
      de design, e sugere um candidato — teto de custo de contexto por skill,
      risco 3. Um requisito não escrito não tem cobertura por definição.
    mitigation: >-
      TASK-SWC-016 mede o custo de contexto real das dez skills e produz o
      dado que a decisão precisa. Se virar requisito, entra por uma nova
      passagem de /sdd-kit:spec, com identificador novo — NFR-SWC-004 — e
      tarefa própria, sem renumerar nada.

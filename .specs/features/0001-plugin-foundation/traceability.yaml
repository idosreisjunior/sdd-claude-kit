# Itens sem cobertura automatizada, registrados explicitamente em vez de
# omitidos. Devem ser reavaliados quando o validador da Fase 4 existir.
gaps:
  - id: NFR-PF-003
    reason: >-
      O comportamento de uma skill é instrução em linguagem natural e não é
      testável deterministicamente. O CUSTO DE CONTEXTO, porém, é medível:
      TASK-PF-002 apurou ~971 tokens sempre ativos e ~4k por invocação, via
      claude plugin details. A lacuna restante é o comportamento, não o custo.
    mitigation: >-
      Revisão humana no critério de conclusão de TASK-PF-007, 009 e 010, mais
      acompanhamento do custo sempre-ativo a cada skill nova.
  - id: NFR-PF-004
    reason: Preparação para i18n é uma propriedade estrutural dos templates.
    mitigation: Revisão humana no critério de conclusão de TASK-PF-005 e 006.

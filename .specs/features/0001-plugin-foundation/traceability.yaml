# ainda não têm implementação — ver o status das tarefas em tasks.md.
#
# TASK-PF-012 implementou a suíte: 127 testes em tests/. TEST-PF-019 (comandos),
# TEST-PF-020 (matriz de plataformas) e TEST-PF-021 (exemplo) ainda não — ver
# a seção `gaps` no fim deste arquivo.

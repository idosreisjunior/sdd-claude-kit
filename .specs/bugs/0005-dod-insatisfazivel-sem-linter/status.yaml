# registrado é indistinguível de uma mudança acidental de estado.
history:
  - status: DRAFT
    date: "2026-07-29"
    reason: >-
      Dogfooding de TASK-PF-016: a Definition of Done exige "lint aprovado" 
      sem ressalva. Projeto sem linter tem lint: null e nenhuma tarefa 
      consegue satisfazer o artigo.

# null significa NÃO APROVADO. Preenchido por /sdd-kit:approve com

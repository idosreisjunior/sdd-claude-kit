# Estado da mudança. Forma válida: plugins/sdd-kit/schemas/status.schema.json
#
# Datas SEMPRE entre aspas: sem elas o YAML produz um objeto data e a
# validação por schema falha. Ver standards.md §9.
version: 1

id: "{{CHANGE_ID}}"
# feature | bug | refactor | change
type: "{{CHANGE_TYPE}}"
title: "{{CHANGE_TITLE}}"

# Toda mudança nasce em DRAFT.
status: DRAFT

created: "{{DATE}}"
updated: "{{DATE}}"

# Histórico de transições. Só acrescenta; nunca reescreve.
# `reason` é obrigatório e não pode ser vazio: uma transição sem motivo
# registrado é indistinguível de uma mudança acidental de estado.
history:
  - status: DRAFT
    date: "{{DATE}}"
    reason: >-
      {{CREATION_REASON}}

# null significa NÃO APROVADO. Preenchido por /sdd-kit:approve com
# {date, by, revision}.
approval: null

# Bloqueios ativos. Lista vazia significa sem bloqueio.
#
# ATENÇÃO ao formato: `question` e `resolves_with` são IDENTIFICADORES, não
# texto. O texto da pergunta vai em `description`. Um bloqueio que não aponta
# para um identificador não pode ser ligado à spec nem ao plano.
#
# {{guia: cada item tem:
#     question       identificador da questão em spec.md — Q1, Q2, …
#     description    o texto da pergunta, livre
#     severity       critical | high | medium | low
#     resolves_with  opcional; id da tarefa que fecha — TASK-<ESCOPO>-NNN
#
#   Exemplo:
#     - question: Q3
#       description: Quais campos são obrigatórios no cadastro?
#       severity: critical
#       resolves_with: TASK-CUST-002
# }}
blocked_by: []

# Questões já resolvidas. Preservadas em vez de apagadas: uma decisão sem
# rastro é indistinguível de uma suposição — ver constitution.md, Art. 5.
#
# Mesmo cuidado com identificadores: `question`, `resolved_by` e `adr` não são
# texto livre.
#
# {{guia: cada item tem:
#     question     identificador — Q1, Q2, …
#     date         "AAAA-MM-DD", entre aspas
#     resolved_by  id da tarefa que resolveu — TASK-<ESCOPO>-NNN
#     summary      o que foi decidido, livre
#     adr          opcional; ADR-NNN, quando houver decisão registrada
# }}
resolved_questions: []

# Contadores derivados de tasks.md. total = pending + in_progress + done.
tasks:
  total: 0
  pending: 0
  in_progress: 0
  done: 0

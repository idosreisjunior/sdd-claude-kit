<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 832" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C6BF0"/><stop offset="1" stop-color="#9C8CFF"/></linearGradient>
    <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E08256"/><stop offset="1" stop-color="#F0A07A"/></linearGradient>
    <linearGradient id="gCanvas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F131A"/><stop offset="1" stop-color="#0C0F14"/></linearGradient>
    <filter id="softsm" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.30"/></filter>
  </defs>

  <rect width="1280" height="832" fill="url(#gCanvas)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="56" fill="#12161D"/>
  <line x1="0" y1="56" x2="1280" y2="56" stroke="#263041"/>
  <g transform="translate(24,13)">
    <rect x="0" y="0" width="30" height="30" rx="8" fill="url(#gViolet)"/>
    <rect x="7" y="8" width="9" height="14" rx="1" fill="none" stroke="#fff" stroke-width="1.5"/><rect x="12" y="10" width="6" height="10" rx="1" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="42" y="14" font-size="14" font-weight="700" fill="#E6EDF3">Assistente de mudança</text>
    <text x="42" y="30" font-size="11" fill="#6B7684">0035 — Wizard de specs</text>
  </g>
  <g transform="translate(1000,18)">
    <rect width="120" height="22" rx="11" fill="#7C6BF0" fill-opacity="0.16"/><circle cx="16" cy="11" r="3.5" fill="#7C6BF0"/><text x="30" y="15" font-size="10" font-weight="600" fill="#9C8CFF">DESIGNED</text>
  </g>
  <text x="1140" y="33" font-size="12" fill="#6B7684">salvo automaticamente</text>
  <path d="M1244,20 l14,14 M1258,20 l-14,14" stroke="#6B7684" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stepper band -->
  <rect x="0" y="56" width="1280" height="66" fill="#0E1219"/>
  <line x1="0" y1="122" x2="1280" y2="122" stroke="#263041"/>
  <g transform="translate(0,86)" font-size="11" text-anchor="middle">
    <!-- connectors -->
    <line x1="90" y1="0" x2="247" y2="0" stroke="#7C6BF0" stroke-width="2"/>
    <line x1="247" y1="0" x2="404" y2="0" stroke="#7C6BF0" stroke-width="2"/>
    <line x1="404" y1="0" x2="561" y2="0" stroke="#263041" stroke-width="2"/>
    <line x1="561" y1="0" x2="718" y2="0" stroke="#263041" stroke-width="2"/>
    <line x1="718" y1="0" x2="875" y2="0" stroke="#263041" stroke-width="2"/>
    <line x1="875" y1="0" x2="1032" y2="0" stroke="#263041" stroke-width="2"/>
    <line x1="1032" y1="0" x2="1189" y2="0" stroke="#263041" stroke-width="2"/>
    <!-- 1 done -->
    <g transform="translate(90,0)"><circle r="13" fill="url(#gViolet)"/><path d="M-4,0 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text y="30" fill="#9AA7B4">Solicitar</text></g>
    <!-- 2 current -->
    <g transform="translate(247,0)"><circle r="14" fill="#161B22" stroke="#7C6BF0" stroke-width="2"/><circle r="4.5" fill="#7C6BF0"/><text y="30" font-weight="700" fill="#E6EDF3">Especificar</text></g>
    <!-- 3..8 future -->
    <g transform="translate(404,0)"><circle r="13" fill="#161B22" stroke="#313C4E" stroke-width="2"/><text y="4" fill="#6B7684">3</text><text y="30" fill="#6B7684">Clarificar</text></g>
    <g transform="translate(561,0)"><circle r="13" fill="#161B22" stroke="#313C4E" stroke-width="2"/><text y="4" fill="#6B7684">4</text><text y="30" fill="#6B7684">Desenhar</text></g>
    <g transform="translate(718,0)"><circle r="13" fill="#161B22" stroke="#313C4E" stroke-width="2"/><text y="4" fill="#6B7684">5</text><text y="30" fill="#6B7684">Tarefas</text></g>
    <g transform="translate(875,0)"><circle r="13" fill="#161B22" stroke="#313C4E" stroke-width="2"/><text y="4" fill="#6B7684">6</text><text y="30" fill="#6B7684">Aprovar</text></g>
    <g transform="translate(1032,0)"><circle r="13" fill="#161B22" stroke="#313C4E" stroke-width="2"/><text y="4" fill="#6B7684">7</text><text y="30" fill="#6B7684">Implementar</text></g>
    <g transform="translate(1189,0)"><circle r="13" fill="#161B22" stroke="#313C4E" stroke-width="2"/><text y="4" fill="#6B7684">8</text><text y="30" fill="#6B7684">Verificar</text></g>
  </g>

  <!-- LEFT PANE: spec editor -->
  <g transform="translate(24,138)">
    <rect width="792" height="618" rx="12" fill="#161B22" stroke="#263041"/>
    <text x="20" y="34" font-size="18" font-weight="700" fill="#E6EDF3">Especificar requisitos</text>
    <text x="20" y="54" font-size="12" fill="#9AA7B4">Requisitos REQ-/NFR-, cenários em Gherkin e critérios de aceite. Nada é inventado — lacunas viram hipótese ou dúvida.</text>

    <!-- sub tabs -->
    <g transform="translate(20,68)" font-size="12" font-weight="600">
      <rect width="140" height="30" rx="8" fill="#1B2230" stroke="#7C6BF0" stroke-opacity="0.5"/><text x="70" y="20" fill="#E6EDF3" text-anchor="middle">Requisitos · 12</text>
      <rect x="150" width="120" height="30" rx="8" fill="none" stroke="#263041"/><text x="210" y="20" fill="#9AA7B4" text-anchor="middle">Cenários · 7</text>
      <rect x="278" width="180" height="30" rx="8" fill="none" stroke="#263041"/><text x="368" y="20" fill="#9AA7B4" text-anchor="middle">Critérios de aceite · 9</text>
      <rect x="620" width="132" height="30" rx="8" fill="none" stroke="#313C4E"/>
      <path d="M636,15 h12 M642,9 v12" stroke="#9AA7B4" stroke-width="1.6" stroke-linecap="round"/>
      <text x="660" y="20" fill="#E6EDF3">Adicionar</text>
    </g>

    <!-- REQ rows -->
    <text x="20" y="130" font-size="11" font-weight="600" letter-spacing="1" fill="#6B7684">FUNCIONAIS</text>
    <g transform="translate(20,140)" font-size="12.5">
      <g transform="translate(0,0)">
        <rect width="752" height="52" rx="10" fill="#12161D" stroke="#263041"/>
        <rect x="12" y="16" width="86" height="20" rx="6" fill="#7C6BF0" fill-opacity="0.16"/><text x="55" y="30" font-size="11" font-weight="600" fill="#9C8CFF" text-anchor="middle">REQ-WIZ-001</text>
        <text x="112" y="30" fill="#E6EDF3">O assistente exibe as 8 etapas do fluxo com o estado atual destacado.</text>
        <path d="M726,20 l8,-8 M730,26 l6,-6" stroke="#6B7684" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <g transform="translate(0,60)">
        <rect width="752" height="52" rx="10" fill="#12161D" stroke="#263041"/>
        <rect x="12" y="16" width="86" height="20" rx="6" fill="#7C6BF0" fill-opacity="0.16"/><text x="55" y="30" font-size="11" font-weight="600" fill="#9C8CFF" text-anchor="middle">REQ-WIZ-002</text>
        <text x="112" y="30" fill="#E6EDF3">Cada etapa só avança quando os pré-requisitos da anterior estão satisfeitos.</text>
        <path d="M726,20 l8,-8 M730,26 l6,-6" stroke="#6B7684" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <g transform="translate(0,120)">
        <rect width="752" height="52" rx="10" fill="#12161D" stroke="#263041"/>
        <rect x="12" y="16" width="86" height="20" rx="6" fill="#7C6BF0" fill-opacity="0.16"/><text x="55" y="30" font-size="11" font-weight="600" fill="#9C8CFF" text-anchor="middle">REQ-WIZ-003</text>
        <text x="112" y="30" fill="#E6EDF3">Ações de IA abrem o Claude Code com o prompt /sdd-kit correspondente.</text>
        <path d="M726,20 l8,-8 M730,26 l6,-6" stroke="#6B7684" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>

    <text x="20" y="378" font-size="11" font-weight="600" letter-spacing="1" fill="#6B7684">NÃO FUNCIONAIS</text>
    <g transform="translate(20,388)" font-size="12.5">
      <g transform="translate(0,0)">
        <rect width="752" height="46" rx="10" fill="#12161D" stroke="#263041"/>
        <rect x="12" y="13" width="88" height="20" rx="6" fill="#38BDC9" fill-opacity="0.16"/><text x="56" y="27" font-size="11" font-weight="600" fill="#38BDC9" text-anchor="middle">NFR-WIZ-001</text>
        <text x="114" y="27" fill="#E6EDF3">O webview respeita a CSP com nonce e escapa todo texto de artefato.</text>
      </g>
    </g>

    <!-- Gherkin peek -->
    <g transform="translate(20,446)">
      <rect width="752" height="150" rx="10" fill="#0E1219" stroke="#263041"/>
      <rect x="12" y="14" width="84" height="20" rx="6" fill="#E0A33A" fill-opacity="0.16"/><text x="54" y="28" font-size="11" font-weight="600" fill="#E0A33A" text-anchor="middle">SCN-WIZ-004</text>
      <text x="106" y="28" font-size="12.5" font-weight="600" fill="#E6EDF3">Avançar sem requisitos é bloqueado</text>
      <g font-family="'JetBrains Mono','Consolas',monospace" font-size="12">
        <text x="16" y="58"><tspan fill="#7C6BF0" font-weight="700">Dado</tspan><tspan fill="#9AA7B4"> uma mudança na etapa Especificar sem nenhum REQ-*</tspan></text>
        <text x="16" y="82"><tspan fill="#7C6BF0" font-weight="700">Quando</tspan><tspan fill="#9AA7B4"> o usuário clica em "Avançar para Clarificar"</tspan></text>
        <text x="16" y="106"><tspan fill="#7C6BF0" font-weight="700">Então</tspan><tspan fill="#9AA7B4"> o botão fica desabilitado e um aviso explica o que falta</tspan></text>
      </g>
      <line x1="12" y1="122" x2="740" y2="122" stroke="#263041"/>
      <text x="16" y="140" font-size="11" fill="#6B7684">▾ ver os outros 6 cenários</text>
    </g>
  </g>

  <!-- RIGHT PANE -->
  <g transform="translate(832,138)">
    <!-- AI assist card -->
    <g filter="url(#softsm)">
      <rect width="424" height="150" rx="12" fill="#1B1A22" stroke="#E08256" stroke-opacity="0.5"/>
      <path d="M28,34 l2.4,6 L36,42 l-5.6,2.4 L28,50 l-2.4,-5.6 L20,42 l5.6,-2 Z" fill="url(#gCoral)"/>
      <text x="48" y="34" font-size="14" font-weight="700" fill="#E6EDF3">Preencher com o Claude Code</text>
      <text x="20" y="66" font-size="12" fill="#9AA7B4">Gera os requisitos a partir da solicitação usando</text>
      <text x="20" y="84" font-size="12" fill="#9AA7B4">o skill <tspan fill="#F0A07A" font-family="monospace">/sdd-kit:spec</tspan> — o prompt é aberto no</text>
      <text x="20" y="102" font-size="12" fill="#9AA7B4">terminal, nunca enviado automaticamente.</text>
      <rect x="20" y="112" width="240" height="30" rx="8" fill="url(#gCoral)"/>
      <path d="M36,127 l1.6,3.4 L41,132 l-3.4,1.6 L36,138 l-1.6,-3.4 L31,132 l3.4,-1.6 Z" fill="#fff"/>
      <text x="52" y="131" font-size="12.5" font-weight="600" fill="#fff">Especificar com IA</text>
      <rect x="270" y="112" width="134" height="30" rx="8" fill="none" stroke="#3A2E2A"/><text x="337" y="131" font-size="12" fill="#E6EDF3" text-anchor="middle">Copiar prompt</text>
    </g>

    <!-- Original request -->
    <g transform="translate(0,166)">
      <rect width="424" height="150" rx="12" fill="#161B22" stroke="#263041"/>
      <text x="20" y="30" font-size="11" font-weight="600" letter-spacing="1" fill="#6B7684">SOLICITAÇÃO ORIGINAL</text>
      <text x="20" y="56" font-size="12.5" fill="#C7D0DA">"Quero deixar a interface da extensão</text>
      <text x="20" y="76" font-size="12.5" fill="#C7D0DA">mais profissional, com um wizard para</text>
      <text x="20" y="96" font-size="12.5" fill="#C7D0DA">criar e gerenciar as especificações até a</text>
      <text x="20" y="116" font-size="12.5" fill="#C7D0DA">implementação do projeto."</text>
      <text x="20" y="138" font-size="11" fill="#4C9BF0">Abrir request.md ▸</text>
    </g>

    <!-- Coverage -->
    <g transform="translate(0,332)">
      <rect width="424" height="150" rx="12" fill="#161B22" stroke="#263041"/>
      <text x="20" y="30" font-size="11" font-weight="600" letter-spacing="1" fill="#6B7684">COBERTURA DA SPEC</text>
      <g transform="translate(58,84)">
        <circle r="30" fill="none" stroke="#263041" stroke-width="7"/>
        <circle r="30" fill="none" stroke="url(#gViolet)" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.4" stroke-dashoffset="47" transform="rotate(-90 0 0)"/>
        <text y="6" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="middle">75%</text>
      </g>
      <g transform="translate(130,54)" font-size="12">
        <circle cx="4" cy="8" r="4" fill="#3FB86B"/><text x="16" y="12" fill="#C7D0DA">9 requisitos com cenário</text>
        <circle cx="4" cy="34" r="4" fill="#E0A33A"/><text x="16" y="38" fill="#C7D0DA">3 sem cenário de aceite</text>
        <circle cx="4" cy="60" r="4" fill="#F0655A"/><text x="16" y="64" fill="#C7D0DA">2 dúvidas em aberto</text>
        <text x="0" y="92" font-size="11" fill="#4C9BF0">Resolver na etapa Clarificar ▸</text>
      </g>
    </g>
  </g>

  <!-- Footer nav -->
  <rect x="0" y="772" width="1280" height="60" fill="#12161D"/>
  <line x1="0" y1="772" x2="1280" y2="772" stroke="#263041"/>
  <g transform="translate(24,786)">
    <rect width="120" height="34" rx="8" fill="none" stroke="#313C4E"/>
    <path d="M28,17 l-6,-6 m6,6 l-6,6 m6,-6 h0" stroke="#9AA7B4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22,17 h-0" /><path d="M20,17 l6,-6 M20,17 l6,6" stroke="#9AA7B4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="22" font-size="13" fill="#E6EDF3" text-anchor="middle">Voltar</text>
  </g>
  <g transform="translate(940,786)">
    <rect width="150" height="34" rx="8" fill="none" stroke="#313C4E"/>
    <text x="75" y="22" font-size="13" fill="#E6EDF3" text-anchor="middle">Salvar rascunho</text>
    <rect x="162" y="0" width="230" height="34" rx="8" fill="url(#gViolet)"/>
    <text x="264" y="22" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Avançar para Clarificar</text>
    <path d="M362,17 l6,-6 M362,17 l6,6 M356,11 l6,6 l-6,6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

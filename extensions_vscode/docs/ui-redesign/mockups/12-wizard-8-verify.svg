<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 832" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C6BF0"/><stop offset="1" stop-color="#9C8CFF"/></linearGradient>
    <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E08256"/><stop offset="1" stop-color="#F0A07A"/></linearGradient>
    <linearGradient id="gCanvas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F131A"/><stop offset="1" stop-color="#0C0F14"/></linearGradient>
    <filter id="softsm" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.30"/></filter>
  </defs>

  <rect width="1280" height="832" fill="url(#gCanvas)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="56" fill="#12161D"/>
  <line x1="0" y1="56" x2="1280" y2="56" stroke="#263041"/>
  <g transform="translate(24,13)">
    <rect x="0" y="0" width="30" height="30" rx="8" fill="url(#gViolet)"/>
    <rect x="7" y="8" width="9" height="14" rx="1" fill="none" stroke="#fff" stroke-width="1.5"/><rect x="12" y="10" width="6" height="10" rx="1" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="42" y="14" font-size="14" font-weight="700" fill="#E6EDF3">Assistente de mudança</text>
    <text x="42" y="30" font-size="11" fill="#6B7684">0035 — Wizard de specs</text>
  </g>
  <g transform="translate(988,18)">
    <rect width="132" height="22" rx="11" fill="#E0823A" fill-opacity="0.16"/><circle cx="16" cy="11" r="3.5" fill="#E0823A"/><text x="30" y="15" font-size="10" font-weight="600" fill="#E0823A">IN_PROGRESS</text>
  </g>
  <text x="1140" y="33" font-size="12" fill="#6B7684">salvo automaticamente</text>
  <path d="M1244,20 l14,14 M1258,20 l-14,14" stroke="#6B7684" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stepper band -->
  <rect x="0" y="56" width="1280" height="66" fill="#0E1219"/>
  <line x1="0" y1="122" x2="1280" y2="122" stroke="#263041"/>
  <g transform="translate(0,86)" font-size="11" text-anchor="middle">
    <!-- connectors: all up to current (8) are violet -->
    <line x1="90" y1="0" x2="247" y2="0" stroke="#7C6BF0" stroke-width="2"/>
    <line x1="247" y1="0" x2="404" y2="0" stroke="#7C6BF0" stroke-width="2"/>
    <line x1="404" y1="0" x2="561" y2="0" stroke="#7C6BF0" stroke-width="2"/>
    <line x1="561" y1="0" x2="718" y2="0" stroke="#7C6BF0" stroke-width="2"/>
    <line x1="718" y1="0" x2="875" y2="0" stroke="#7C6BF0" stroke-width="2"/>
    <line x1="875" y1="0" x2="1032" y2="0" stroke="#7C6BF0" stroke-width="2"/>
    <line x1="1032" y1="0" x2="1189" y2="0" stroke="#7C6BF0" stroke-width="2"/>
    <!-- 1..7 done -->
    <g transform="translate(90,0)"><circle r="13" fill="url(#gViolet)"/><path d="M-4,0 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text y="30" fill="#9AA7B4">Solicitar</text></g>
    <g transform="translate(247,0)"><circle r="13" fill="url(#gViolet)"/><path d="M-4,0 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text y="30" fill="#9AA7B4">Especificar</text></g>
    <g transform="translate(404,0)"><circle r="13" fill="url(#gViolet)"/><path d="M-4,0 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text y="30" fill="#9AA7B4">Clarificar</text></g>
    <g transform="translate(561,0)"><circle r="13" fill="url(#gViolet)"/><path d="M-4,0 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text y="30" fill="#9AA7B4">Desenhar</text></g>
    <g transform="translate(718,0)"><circle r="13" fill="url(#gViolet)"/><path d="M-4,0 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text y="30" fill="#9AA7B4">Tarefas</text></g>
    <g transform="translate(875,0)"><circle r="13" fill="url(#gViolet)"/><path d="M-4,0 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text y="30" fill="#9AA7B4">Aprovar</text></g>
    <g transform="translate(1032,0)"><circle r="13" fill="url(#gViolet)"/><path d="M-4,0 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text y="30" fill="#9AA7B4">Implementar</text></g>
    <!-- 8 current -->
    <g transform="translate(1189,0)"><circle r="14" fill="#161B22" stroke="#7C6BF0" stroke-width="2"/><circle r="4.5" fill="#7C6BF0"/><text y="30" font-weight="700" fill="#E6EDF3">Verificar</text></g>
  </g>

  <!-- LEFT PANE: verify -->
  <g transform="translate(24,138)">
    <rect width="792" height="618" rx="12" fill="#161B22" stroke="#263041"/>
    <text x="20" y="34" font-size="18" font-weight="700" fill="#E6EDF3">Verificar a mudança</text>
    <text x="20" y="52" font-size="12" fill="#9AA7B4">Avalia cada critério de aceite com evidência e roda os comandos de validação.</text>
    <text x="20" y="68" font-size="12" fill="#9AA7B4">Exige prova de execução — não basta o código de saída zero.</text>

    <!-- Acceptance criteria -->
    <text x="20" y="96" font-size="11" font-weight="600" letter-spacing="1" fill="#6B7684">CRITÉRIOS DE ACEITE</text>
    <g transform="translate(20,106)" font-size="12.5">
      <!-- SCN-WIZ-001 aprovado -->
      <g transform="translate(0,0)">
        <rect width="752" height="44" rx="10" fill="#12161D" stroke="#263041"/>
        <rect x="12" y="12" width="92" height="20" rx="6" fill="#3FB86B" fill-opacity="0.16"/><text x="58" y="26" font-size="10" font-weight="600" fill="#3FB86B" text-anchor="middle">SCN-WIZ-001</text>
        <text x="116" y="26" fill="#E6EDF3">8 etapas exibidas com estado</text>
        <rect x="558" y="12" width="74" height="20" rx="10" fill="#3FB86B" fill-opacity="0.16"/><text x="595" y="26" font-size="10" font-weight="600" fill="#3FB86B" text-anchor="middle">APROVADO</text>
        <text x="642" y="26" font-size="11" fill="#4C9BF0">evidência ▸</text>
      </g>
      <!-- SCN-WIZ-002 aprovado -->
      <g transform="translate(0,50)">
        <rect width="752" height="44" rx="10" fill="#12161D" stroke="#263041"/>
        <rect x="12" y="12" width="92" height="20" rx="6" fill="#3FB86B" fill-opacity="0.16"/><text x="58" y="26" font-size="10" font-weight="600" fill="#3FB86B" text-anchor="middle">SCN-WIZ-002</text>
        <text x="116" y="26" fill="#E6EDF3">avanço bloqueado sem requisitos</text>
        <rect x="558" y="12" width="74" height="20" rx="10" fill="#3FB86B" fill-opacity="0.16"/><text x="595" y="26" font-size="10" font-weight="600" fill="#3FB86B" text-anchor="middle">APROVADO</text>
        <text x="642" y="26" font-size="11" fill="#4C9BF0">evidência ▸</text>
      </g>
      <!-- SCN-WIZ-003 aprovado -->
      <g transform="translate(0,100)">
        <rect width="752" height="44" rx="10" fill="#12161D" stroke="#263041"/>
        <rect x="12" y="12" width="92" height="20" rx="6" fill="#3FB86B" fill-opacity="0.16"/><text x="58" y="26" font-size="10" font-weight="600" fill="#3FB86B" text-anchor="middle">SCN-WIZ-003</text>
        <text x="116" y="26" fill="#E6EDF3">ações de IA abrem o Claude Code</text>
        <rect x="558" y="12" width="74" height="20" rx="10" fill="#3FB86B" fill-opacity="0.16"/><text x="595" y="26" font-size="10" font-weight="600" fill="#3FB86B" text-anchor="middle">APROVADO</text>
        <text x="642" y="26" font-size="11" fill="#4C9BF0">evidência ▸</text>
      </g>
      <!-- SCN-WIZ-004 aprovado -->
      <g transform="translate(0,150)">
        <rect width="752" height="44" rx="10" fill="#12161D" stroke="#263041"/>
        <rect x="12" y="12" width="92" height="20" rx="6" fill="#3FB86B" fill-opacity="0.16"/><text x="58" y="26" font-size="10" font-weight="600" fill="#3FB86B" text-anchor="middle">SCN-WIZ-004</text>
        <text x="116" y="26" fill="#E6EDF3">transições gravam em status.yaml</text>
        <rect x="558" y="12" width="74" height="20" rx="10" fill="#3FB86B" fill-opacity="0.16"/><text x="595" y="26" font-size="10" font-weight="600" fill="#3FB86B" text-anchor="middle">APROVADO</text>
        <text x="642" y="26" font-size="11" fill="#4C9BF0">evidência ▸</text>
      </g>
      <!-- SCN-WIZ-005 pendente -->
      <g transform="translate(0,200)">
        <rect width="752" height="44" rx="10" fill="#12161D" stroke="#263041"/>
        <rect x="12" y="12" width="92" height="20" rx="6" fill="#E0A33A" fill-opacity="0.16"/><text x="58" y="26" font-size="10" font-weight="600" fill="#E0A33A" text-anchor="middle">SCN-WIZ-005</text>
        <text x="116" y="26" fill="#E6EDF3">editor estruturado persiste no spec.md</text>
        <rect x="558" y="12" width="74" height="20" rx="10" fill="#E0A33A" fill-opacity="0.16"/><text x="595" y="26" font-size="10" font-weight="600" fill="#E0A33A" text-anchor="middle">PENDENTE</text>
        <text x="642" y="26" font-size="11" fill="#6B7684">não avaliado</text>
      </g>
    </g>

    <!-- Validation commands -->
    <text x="20" y="370" font-size="11" font-weight="600" letter-spacing="1" fill="#6B7684">COMANDOS DE VALIDAÇÃO</text>
    <g transform="translate(20,380)">
      <!-- npm run lint -->
      <g transform="translate(0,0)">
        <rect width="752" height="54" rx="10" fill="#12161D" stroke="#263041"/>
        <text x="16" y="24" font-size="13" font-weight="600" fill="#E6EDF3" font-family="'JetBrains Mono','Consolas',monospace">npm run lint</text>
        <rect x="644" y="10" width="84" height="20" rx="10" fill="#3FB86B" fill-opacity="0.16"/><text x="686" y="24" font-size="10" font-weight="600" fill="#3FB86B" text-anchor="middle">APROVADO</text>
        <text x="16" y="44" font-size="11" fill="#6B7684">exit 0, 0 problemas</text>
      </g>
      <!-- npm test -->
      <g transform="translate(0,62)">
        <rect width="752" height="54" rx="10" fill="#12161D" stroke="#263041"/>
        <text x="16" y="24" font-size="13" font-weight="600" fill="#E6EDF3" font-family="'JetBrains Mono','Consolas',monospace">npm test</text>
        <rect x="644" y="10" width="84" height="20" rx="10" fill="#3FB86B" fill-opacity="0.16"/><text x="686" y="24" font-size="10" font-weight="600" fill="#3FB86B" text-anchor="middle">APROVADO</text>
        <text x="16" y="44" font-size="11" fill="#6B7684">42 testes, 42 ok</text>
      </g>
      <!-- npm run build -->
      <g transform="translate(0,124)">
        <rect width="752" height="54" rx="10" fill="#12161D" stroke="#263041"/>
        <text x="16" y="24" font-size="13" font-weight="600" fill="#9AA7B4" font-family="'JetBrains Mono','Consolas',monospace">npm run build</text>
        <rect x="586" y="10" width="150" height="20" rx="10" fill="#6B7684" fill-opacity="0.16"/><text x="661" y="24" font-size="10" font-weight="600" fill="#9AA7B4" text-anchor="middle">NÃO CONFIGURADO</text>
        <text x="16" y="44" font-size="11" fill="#6B7684">comando ausente em .specs/config.yaml</text>
      </g>
    </g>
  </g>

  <!-- RIGHT PANE -->
  <g transform="translate(832,138)">
    <!-- AI assist card -->
    <g filter="url(#softsm)">
      <rect width="424" height="150" rx="12" fill="#1B1A22" stroke="#E08256" stroke-opacity="0.5"/>
      <path d="M28,34 l2.4,6 L36,42 l-5.6,2.4 L28,50 l-2.4,-5.6 L20,42 l5.6,-2 Z" fill="url(#gCoral)"/>
      <text x="48" y="34" font-size="14" font-weight="700" fill="#E6EDF3">Coletar evidências e validar</text>
      <text x="20" y="66" font-size="12" fill="#9AA7B4">Roda os critérios de aceite e os comandos de</text>
      <text x="20" y="84" font-size="12" fill="#9AA7B4">validação usando o skill <tspan fill="#F0A07A" font-family="monospace">/sdd-kit:verify</tspan> — o</text>
      <text x="20" y="102" font-size="12" fill="#9AA7B4">prompt é aberto no terminal, nunca enviado.</text>
      <rect x="20" y="112" width="176" height="30" rx="8" fill="url(#gCoral)"/>
      <path d="M36,127 l1.6,3.4 L41,132 l-3.4,1.6 L36,138 l-1.6,-3.4 L31,132 l3.4,-1.6 Z" fill="#fff"/>
      <text x="52" y="131" font-size="12.5" font-weight="600" fill="#fff">Verificar com IA</text>
      <rect x="206" y="112" width="198" height="30" rx="8" fill="none" stroke="#3A2E2A"/><text x="305" y="131" font-size="12" fill="#E6EDF3" text-anchor="middle">Copiar prompt</text>
    </g>

    <!-- Summary -->
    <g transform="translate(0,166)">
      <rect width="424" height="150" rx="12" fill="#161B22" stroke="#263041"/>
      <text x="20" y="30" font-size="11" font-weight="600" letter-spacing="1" fill="#6B7684">RESUMO DA VERIFICAÇÃO</text>
      <g transform="translate(58,84)">
        <circle r="30" fill="none" stroke="#263041" stroke-width="7"/>
        <circle r="30" fill="none" stroke="url(#gViolet)" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.4" stroke-dashoffset="21" transform="rotate(-90 0 0)"/>
        <text y="6" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="middle">89%</text>
      </g>
      <g transform="translate(130,54)" font-size="12">
        <circle cx="4" cy="8" r="4" fill="#3FB86B"/><text x="16" y="12" fill="#C7D0DA">8/9 critérios aprovados</text>
        <circle cx="4" cy="34" r="4" fill="#E0A33A"/><text x="16" y="38" fill="#C7D0DA">1 pendente</text>
        <circle cx="4" cy="60" r="4" fill="#4C9BF0"/><text x="16" y="64" fill="#C7D0DA">2/3 validações executadas</text>
      </g>
    </g>

    <!-- Gate note -->
    <g transform="translate(0,332)">
      <rect width="424" height="96" rx="12" fill="#161B22" stroke="#263041"/>
      <rect x="0" y="0" width="4" height="96" rx="2" fill="#E0A33A"/>
      <circle cx="36" cy="30" r="10" fill="none" stroke="#E0A33A" stroke-width="1.6"/>
      <path d="M36,25 v8 M36,37 v0.5" stroke="#E0A33A" stroke-width="1.8" stroke-linecap="round"/>
      <text x="56" y="26" font-size="12" font-weight="600" fill="#E6EDF3">Regra de promoção</text>
      <text x="56" y="46" font-size="12" fill="#9AA7B4">Requisito sem tarefa ou tarefa sem teste</text>
      <text x="56" y="64" font-size="12" fill="#9AA7B4">bloqueia a promoção para VERIFIED.</text>
    </g>
  </g>

  <!-- Footer nav -->
  <rect x="0" y="772" width="1280" height="60" fill="#12161D"/>
  <line x1="0" y1="772" x2="1280" y2="772" stroke="#263041"/>
  <g transform="translate(24,786)">
    <rect width="120" height="34" rx="8" fill="none" stroke="#313C4E"/>
    <path d="M20,17 l6,-6 M20,17 l6,6" stroke="#9AA7B4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="22" font-size="13" fill="#E6EDF3" text-anchor="middle">Voltar</text>
  </g>
  <text x="854" y="805" font-size="10.5" fill="#E0A33A" text-anchor="end">Avalie SCN-WIZ-005 para promover</text>
  <g transform="translate(864,786)">
    <rect width="120" height="34" rx="8" fill="none" stroke="#313C4E"/>
    <text x="60" y="22" font-size="13" fill="#E6EDF3" text-anchor="middle">Arquivar</text>
    <g transform="translate(132,0)">
      <rect width="260" height="34" rx="8" fill="#3FB86B"/>
      <path d="M16,17 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="22" font-size="13" font-weight="600" fill="#fff">Promover para VERIFIED</text>
    </g>
  </g>
</svg>

        <circle cx="20" cy="88" r="2.5"/><circle cx="54" cy="88" r="2.5"/><circle cx="88" cy="88" r="2.5"/><circle cx="122" cy="88" r="2.5"/><circle cx="156" cy="88" r="2.5" fill="#7C6BF0" stroke="none"/><circle cx="190" cy="88" r="2.5"/>

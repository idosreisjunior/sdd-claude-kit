      <rect width="424" height="130" rx="12" fill="#161B22" stroke="#263041"/>
      <text x="20" y="30" font-size="11" font-weight="600" letter-spacing="1" fill="#6B7684">ESCOPO (GIT)</text>
      <g transform="translate(28,54)">
        <circle r="9" fill="#3FB86B" fill-opacity="0.16"/><path d="M-4,0 l3,3 l6,-7" fill="none" stroke="#3FB86B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="20" y="4" font-size="12.5" fill="#E6EDF3">4 arquivos alterados · +182 / −20 linhas</text>
      </g>
      <g transform="translate(28,84)">
        <circle r="9" fill="#3FB86B" fill-opacity="0.16"/><path d="M-4,0 l3,3 l6,-7" fill="none" stroke="#3FB86B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="20" y="4" font-size="12.5" fill="#E6EDF3">Nenhum arquivo sensível tocado</text>
      </g>
      <text x="20" y="116" font-size="11" fill="#6B7684">limite: 20 arquivos / 400 linhas</text>
    </g>

    <!-- Acceptance criterion -->
    <g transform="translate(0,352)">
      <rect width="424" height="100" rx="12" fill="#161B22" stroke="#263041"/>
      <text x="20" y="30" font-size="11" font-weight="600" letter-spacing="1" fill="#6B7684">CRITÉRIO DA TAREFA ATUAL</text>
      <text x="20" y="52" font-size="12.5" fill="#C7D0DA">Critério: a ação de IA abre o terminal</text>
      <text x="20" y="72" font-size="12.5" fill="#C7D0DA">com o prompt correto e nunca envia</text>
      <text x="20" y="92" font-size="12.5" fill="#C7D0DA">sozinha.</text>
    </g>
  </g>

  <!-- Footer nav -->
  <rect x="0" y="772" width="1280" height="60" fill="#12161D"/>
  <line x1="0" y1="772" x2="1280" y2="772" stroke="#263041"/>
  <g transform="translate(24,786)">
    <rect width="120" height="34" rx="8" fill="none" stroke="#313C4E"/>
    <path d="M20,17 l6,-6 M20,17 l6,6" stroke="#9AA7B4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="22" font-size="13" fill="#E6EDF3" text-anchor="middle">Voltar</text>
  </g>
  <g transform="translate(1026,786)">
    <rect width="230" height="34" rx="8" fill="url(#gViolet)"/>
    <text x="105" y="22" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Avançar para Verificar</text>
    <path d="M200,17 l6,-6 M200,17 l6,6 M194,11 l6,6 l-6,6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

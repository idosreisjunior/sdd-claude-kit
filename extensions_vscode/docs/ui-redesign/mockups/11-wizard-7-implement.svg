        <text x="600" y="61" font-size="12" font-weight="600" fill="#fff">Abrir no Claude Code</text>
      </g>
      <!-- TASK-WIZ-005 pendente -->
      <g transform="translate(0,286)">
        <rect width="752" height="54" rx="10" fill="#12161D" stroke="#263041"/>
        <circle cx="26" cy="27" r="11" fill="none" stroke="#313C4E" stroke-width="2"/>
        <text x="52" y="23" font-size="11" font-family="'JetBrains Mono','Consolas',monospace" fill="#6B7684">TASK-WIZ-005</text>
        <text x="52" y="41" font-size="12.5" fill="#9AA7B4">editor estruturado</text>
        <text x="732" y="31" font-size="11" fill="#6B7684" text-anchor="end">pendente</text>
      </g>
      <!-- TASK-WIZ-006 pendente -->
      <g transform="translate(0,348)">
        <rect width="752" height="54" rx="10" fill="#12161D" stroke="#263041"/>
        <circle cx="26" cy="27" r="11" fill="none" stroke="#313C4E" stroke-width="2"/>
        <text x="52" y="23" font-size="11" font-family="'JetBrains Mono','Consolas',monospace" fill="#6B7684">TASK-WIZ-006</text>
        <text x="52" y="41" font-size="12.5" fill="#9AA7B4">testes</text>
        <text x="732" y="31" font-size="11" fill="#6B7684" text-anchor="end">pendente</text>
      </g>

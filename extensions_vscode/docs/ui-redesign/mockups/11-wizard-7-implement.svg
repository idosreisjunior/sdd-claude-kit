      <path d="M28,34 l2.4,6 L36,42 l-5.6,2.4 L28,50 l-2.4,-5.6 L20,42 l5.6,-2 Z" fill="url(#gCoral)"/>
      <text x="48" y="34" font-size="14" font-weight="700" fill="#E6EDF3">Implementar a próxima tarefa</text>
      <text x="20" y="64" font-size="12" fill="#9AA7B4">Abre o terminal com o comando pronto —</text>
      <text x="20" y="82" font-size="12" fill="#9AA7B4">nunca executa sozinho.</text>
      <rect x="20" y="94" width="384" height="36" rx="8" fill="#0A0D12" stroke="#263041"/>
      <text x="32" y="117" font-size="11.5" font-family="'JetBrains Mono','Consolas',monospace"><tspan fill="#3FB86B">$</tspan><tspan fill="#9AA7B4"> claude /sdd-kit implement 0035 --task TASK-WIZ-004</tspan></text>
      <rect x="20" y="144" width="220" height="34" rx="8" fill="url(#gCoral)"/>
      <path d="M38,158 l1.6,3.4 L43,163 l-3.4,1.6 L38,169 l-1.6,-3.4 L33,163 l3.4,-1.6 Z" fill="#fff"/>
      <text x="54" y="165" font-size="12.5" font-weight="600" fill="#fff">Abrir no Claude Code</text>
    </g>

    <!-- Scope guard -->

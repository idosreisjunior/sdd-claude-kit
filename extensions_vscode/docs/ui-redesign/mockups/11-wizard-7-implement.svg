  <!-- LEFT PANE: task list -->
  <g transform="translate(24,138)">
    <rect width="792" height="618" rx="12" fill="#161B22" stroke="#263041"/>
    <text x="20" y="34" font-size="18" font-weight="700" fill="#E6EDF3">Implementar, uma tarefa por vez</text>
    <text x="20" y="54" font-size="12" fill="#9AA7B4">Uma tarefa por vez. O Claude Code implementa; o cockpit acompanha o progresso, escopo e testes.</text>

    <text x="20" y="84" font-size="11" font-weight="600" letter-spacing="1" fill="#6B7684">PROGRESSO</text>
    <text x="772" y="84" font-size="12" font-weight="600" fill="#E6EDF3" text-anchor="end">3/9 tarefas (33%)</text>
    <rect x="20" y="92" width="752" height="8" rx="4" fill="#263041"/>
    <rect x="20" y="92" width="248" height="8" rx="4" fill="url(#gViolet)"/>

    <text x="20" y="128" font-size="11" font-weight="600" letter-spacing="1" fill="#6B7684">TAREFAS</text>

    <g transform="translate(20,140)" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
      <!-- TASK-WIZ-001 done -->
      <g transform="translate(0,0)">
        <rect width="752" height="54" rx="10" fill="#12161D" stroke="#263041"/>
        <circle cx="26" cy="27" r="11" fill="#3FB86B" fill-opacity="0.16"/>
        <path d="M21,27 l4,4 l8,-9" fill="none" stroke="#3FB86B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="23" font-size="11" font-family="'JetBrains Mono','Consolas',monospace" fill="#6B7684">TASK-WIZ-001</text>
        <text x="52" y="41" font-size="12.5" fill="#6B7684">wizardModel + guardas</text>
        <text x="732" y="31" font-size="11" fill="#3FB86B" text-anchor="end">concluída</text>
      </g>
      <!-- TASK-WIZ-002 done -->
      <g transform="translate(0,62)">
        <rect width="752" height="54" rx="10" fill="#12161D" stroke="#263041"/>
        <circle cx="26" cy="27" r="11" fill="#3FB86B" fill-opacity="0.16"/>
        <path d="M21,27 l4,4 l8,-9" fill="none" stroke="#3FB86B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="23" font-size="11" font-family="'JetBrains Mono','Consolas',monospace" fill="#6B7684">TASK-WIZ-002</text>
        <text x="52" y="41" font-size="12.5" fill="#6B7684">stepper e shell</text>
        <text x="732" y="31" font-size="11" fill="#3FB86B" text-anchor="end">concluída</text>
      </g>
      <!-- TASK-WIZ-003 done -->
      <g transform="translate(0,124)">
        <rect width="752" height="54" rx="10" fill="#12161D" stroke="#263041"/>
        <circle cx="26" cy="27" r="11" fill="#3FB86B" fill-opacity="0.16"/>
        <path d="M21,27 l4,4 l8,-9" fill="none" stroke="#3FB86B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="23" font-size="11" font-family="'JetBrains Mono','Consolas',monospace" fill="#6B7684">TASK-WIZ-003</text>
        <text x="52" y="41" font-size="12.5" fill="#6B7684">persistir transições</text>
        <text x="732" y="31" font-size="11" fill="#3FB86B" text-anchor="end">concluída</text>
      </g>
      <!-- TASK-WIZ-004 EM CURSO -->
      <g transform="translate(0,186)" filter="url(#softsm)">
        <rect width="752" height="90" rx="10" fill="#1B2230" stroke="#7C6BF0" stroke-width="1.5"/>
        <circle cx="26" cy="26" r="10" fill="none" stroke="#7C6BF0" stroke-opacity="0.4" stroke-width="2"/>
        <circle cx="26" cy="26" r="6" fill="#7C6BF0"/>
        <text x="52" y="22" font-size="11" font-weight="700" font-family="'JetBrains Mono','Consolas',monospace" fill="#9C8CFF">TASK-WIZ-004</text>
        <text x="52" y="40" font-size="13" font-weight="700" fill="#E6EDF3">ações de IA (Claude Code)</text>
        <rect x="638" y="14" width="98" height="20" rx="10" fill="#7C6BF0" fill-opacity="0.16"/>
        <text x="687" y="28" font-size="10" font-weight="600" fill="#9C8CFF" text-anchor="middle">EM CURSO</text>

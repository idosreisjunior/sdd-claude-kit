<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 832" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C6BF0"/><stop offset="1" stop-color="#9C8CFF"/></linearGradient>
    <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E08256"/><stop offset="1" stop-color="#F0A07A"/></linearGradient>
    <linearGradient id="gCanvas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F131A"/><stop offset="1" stop-color="#0C0F14"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/></filter>
    <filter id="softsm" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.30"/></filter>
  </defs>

  <rect width="1280" height="832" fill="url(#gCanvas)"/>

  <!-- Faint board-column silhouette (depth cue, extremely subtle) -->
  <g opacity="0.06">
    <rect x="24" y="116" width="190" height="692" rx="12" fill="#7C6BF0"/>
    <rect x="230" y="116" width="190" height="692" rx="12" fill="#7C6BF0"/>
    <rect x="436" y="116" width="190" height="692" rx="12" fill="#7C6BF0"/>
    <rect x="642" y="116" width="190" height="692" rx="12" fill="#7C6BF0"/>
    <rect x="848" y="116" width="190" height="692" rx="12" fill="#7C6BF0"/>
    <rect x="1054" y="116" width="190" height="692" rx="12" fill="#7C6BF0"/>
  </g>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="56" fill="#12161D"/>
  <line x1="0" y1="56" x2="1280" y2="56" stroke="#263041"/>
  <g transform="translate(24,13)">
    <rect x="0" y="0" width="30" height="30" rx="8" fill="url(#gViolet)"/>
    <rect x="7" y="8" width="9" height="14" rx="1" fill="none" stroke="#fff" stroke-width="1.5"/><rect x="12" y="10" width="6" height="10" rx="1" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="42" y="14" font-size="14" font-weight="700" fill="#E6EDF3">SDD Cockpit</text>
    <text x="42" y="30" font-size="11" fill="#6B7684">Spec-Driven Development para Claude Code</text>
  </g>

  <!-- Hero -->
  <g transform="translate(608,96)">
    <rect width="64" height="64" rx="16" fill="url(#gViolet)"/>
    <path d="M17,17 h21 a5.6,5.6 0 0 1 5.6,5.6 v19 a5.6,5.6 0 0 1 -5.6,5.6 h-21 Z" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M38,13 l3,6.4 L47,23 l-6.4,3 L38,32 l-3,-6.4 L28,23 l6.4,-3 Z" fill="#fff"/>
  </g>

  <text x="640" y="204" font-size="30" font-weight="700" fill="#E6EDF3" text-anchor="middle">Bem-vindo ao SDD Cockpit</text>
  <text x="640" y="232" font-size="14" fill="#9AA7B4" text-anchor="middle">A especificação vem antes do código. Organize requisitos, decisões e rastreabilidade —</text>
  <text x="640" y="252" font-size="14" fill="#9AA7B4" text-anchor="middle">do primeiro requisito à verificação — sem sair do VS Code.</text>

  <!-- Primary CTA -->
  <g filter="url(#softsm)">
    <rect x="510" y="284" width="260" height="48" rx="10" fill="url(#gViolet)"/>
  </g>
  <path d="M540,308 h12 M546,302 v12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="572" y="313" font-size="14" font-weight="600" fill="#fff">Inicializar SDD</text>
  <text x="640" y="356" font-size="11" fill="#6B7684" text-anchor="middle">Não sobrescreve arquivos de código.</text>

  <!-- Como funciona -->
  <text x="640" y="414" font-size="11" font-weight="600" letter-spacing="1" fill="#6B7684" text-anchor="middle">COMO FUNCIONA</text>

  <!-- Step card 1 -->
  <g transform="translate(76,444)">
    <rect width="360" height="150" rx="12" fill="#161B22" stroke="#263041"/>
    <circle cx="28" cy="28" r="14" fill="url(#gViolet)"/>
    <text x="28" y="32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <g transform="translate(310,14)" fill="none" stroke="#9AA7B4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4,2 h10 l6,6 v14 a1,1 0 0 1 -1,1 H4 a1,1 0 0 1 -1,-1 V3 a1,1 0 0 1 1,-1 Z"/>
      <path d="M14,2 v6 h6"/>
    </g>
    <path d="M330,8 l1.2,2.6 L334,12 l-2.6,1.2 L330,16 l-1.2,-2.6 L326,12 l2.6,-1.2 Z" fill="#7C6BF0"/>
    <text x="24" y="70" font-size="15" font-weight="700" fill="#E6EDF3">Especifique</text>
    <text x="24" y="94" font-size="12" fill="#9AA7B4">Descreva a mudança em linguagem natural; o Claude Code</text>
    <text x="24" y="112" font-size="12" fill="#9AA7B4">ajuda a gerar requisitos e cenários.</text>
  </g>

  <!-- Step card 2 -->
  <g transform="translate(460,444)">
    <rect width="360" height="150" rx="12" fill="#161B22" stroke="#263041"/>
    <circle cx="28" cy="28" r="14" fill="url(#gViolet)"/>
    <text x="28" y="32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <g transform="translate(310,14)" fill="none" stroke="#9AA7B4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="1" width="6" height="20" rx="1"/><rect x="9" y="1" width="6" height="14" rx="1"/><rect x="17" y="1" width="6" height="17" rx="1"/>
    </g>
    <text x="24" y="70" font-size="15" font-weight="700" fill="#E6EDF3">Planeje</text>
    <text x="24" y="94" font-size="12" fill="#9AA7B4">Clarifique dúvidas, registre ADRs e decomponha em</text>
    <text x="24" y="112" font-size="12" fill="#9AA7B4">tarefas ligadas a requisitos.</text>
  </g>

  <!-- Step card 3 -->
  <g transform="translate(844,444)">
    <rect width="360" height="150" rx="12" fill="#161B22" stroke="#263041"/>
    <circle cx="28" cy="28" r="14" fill="url(#gViolet)"/>
    <text x="28" y="32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <g transform="translate(310,14)" fill="none" stroke="#9AA7B4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="4" cy="3" r="2.2"/><circle cx="4" cy="17" r="2.2"/><circle cx="16" cy="6" r="2.2"/>
      <path d="M4,5.2 v9.6 M4,10 a10,10 0 0 0 10,-3.4"/>
    </g>
    <text x="24" y="64" font-size="15" font-weight="700" fill="#E6EDF3">Implemente com</text>
    <text x="24" y="82" font-size="15" font-weight="700" fill="#E6EDF3">rastreabilidade</text>
    <text x="24" y="106" font-size="12" fill="#9AA7B4">Implemente uma tarefa por vez e verifique cada</text>
    <text x="24" y="124" font-size="12" fill="#9AA7B4">critério com evidência.</text>
  </g>

  <!-- Footer / traceability -->
  <text x="640" y="800" font-size="11" font-family="'SF Mono','Consolas',monospace" fill="#6B7684" text-anchor="middle">requisito → cenário → tarefa → arquivo → teste</text>
</svg>

# Itens registrados explicitamente em vez de omitidos.
gaps:
  - id: "REQ-TRACE-005"
    reason: >-
      Sugestões de branch/commit — incremento futuro (D-Q2). Ainda sem tarefa;
      SCN-TRACE-008 fica pendente até lá.
    mitigation: "Planejar e implementar em incremento próprio; 0007 segue IN_PROGRESS."
  - id: "NFR-TRACE-001"
    reason: >-
      "Somente leitura" é propriedade da borda (TASK-TRACE-005/006), não expressável
      em teste unitário puro.
    mitigation: "Revisão manual do adapter — apenas comandos de leitura; nenhuma escrita."
  - id: "NFR-TRACE-004"
    reason: "Ausência de rede é propriedade da borda (adapter), não testável no núcleo."
    mitigation: "Revisão manual: o adapter só executa git local; nenhum I/O de rede."

# Histórico de transições. Só acrescenta; nunca reescreve.
# `reason` é obrigatório e não pode ser vazio: uma transição sem motivo
# registrado é indistinguível de uma mudança acidental de estado.
history:
  - status: DRAFT
    date: "2026-08-02"
    reason: >-
      Criada por /sdd-kit:new para materializar o RF-019 (integração com GitHub)
      — requisito pós-MVP (Fase 3, "could have") sem cobertura no index.yaml.
      Rascunho: mecanismo (gh CLI vs REST vs auth) e recorte das 9 operações.
  - status: PLANNED
    date: "2026-08-02"
    reason: >-
      Plano gerado por /sdd-kit:tasks a partir dos requisitos (3 tarefas: 1 P,
      2 M; TASK-GH-001 e 002 paralelizáveis; caminho crítico TASK-GH-002 → 003).
      Transição DRAFT → PLANNED com CLARIFIED e DESIGNED pulados, confirmada pelo
      usuário: as skills clarify e design chegam na Fase 2. Q1/Q2/Q3/Q6 decididas
      na spec (mecanismo gh CLI; incremento = gerar descrição + criar issue/PR;
      corpo = requisitos+validação+evidências; issue OU PR sem atualizar status);
      Q4 (detecção) e Q5 (gatilho) em TASK-GH-001 (ADR-020). Cobertura completa
      (5 requisitos com tarefa); sem requisito descoberto, tarefa órfã, ciclo ou G.
  - status: IN_PROGRESS
    date: "2026-08-03"
    reason: >-
      Implementação já concluída fora da ordem formal do fluxo — as 3 tarefas do plano estavam done com os testes passando — enquanto approve e verify eram tratados como Fase 2. PLANNED to IN_PROGRESS registrada para refletir o trabalho de implementação executado antes da verificação; approve permanece pulado (approval segue null), no mesmo padrão da 0010-publishing.
  - status: VERIFIED
    date: "2026-08-03"
    reason: >-
      Verificação por evidência (build e lint limpos; suíte 136/136 via node --test). REQ-GH-001 e NFR-GH-003 (geração da descrição com requisitos, validação e evidências, robusta a artefatos parciais) verificados por TEST-GH-001 e TEST-GH-002 sobre buildGithubBody (githubBody.ts), núcleo puro sem import de vscode ou rede. REQ-GH-002/SCN-GH-003/SCN-GH-004/NFR-GH-001/NFR-GH-002 (criar issue ou PR via gh sob confirmação modal; sem gh ou remoto informa a pré-condição e não publica; sem rede própria) são integração com o host e com o gh — implementados em github() (extension.ts) e githubAdapter.ts (ghAvailable/ghCreate), registrados em traceability.yaml gaps com mitigação por revisão manual, no mesmo padrão do adapter de Git da 0007 (também shell-out sem teste unitário, núcleo puro testado). Q4/Q5 resolvidas por ADR-020; sem bloqueio.
  - status: ARCHIVED
    date: "2026-08-03"
    reason: >-
      Arquivada após verificação: a mudança está concluída e faz parte da extensão publicada (v0.2.1). Transição de VERIFIED para ARCHIVED (estado terminal), movendo-a ao grupo Concluídas do painel; os artefatos permanecem em .specs/features para rastreabilidade e os identificadores nunca são reutilizados. Sem alteração de código.


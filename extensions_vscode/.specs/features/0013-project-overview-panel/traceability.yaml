# Itens sem cobertura automatizada, registrados explicitamente em vez de
# omitidos. Um requisito que só dá para verificar por revisão humana continua
# sendo um requisito — o que não pode é a lacuna ficar invisível.
gaps:
  - id: "NFR-PROJ-001"
    reason: >-
      "Somente leitura" é uma propriedade de integração com a API do VS Code
      (TASK-PROJ-004): não há escrita a assertar num teste unitário puro.
    mitigation: >-
      Revisão manual do provider — confirmar que nenhuma escrita ocorre além da
      DiagnosticCollection sob ação explícita; núcleos puros (PROJ-002/003) não
      importam `vscode`.
  - id: "NFR-PROJ-003"
    reason: >-
      "Não varrer o repositório nem rodar Doctor ao abrir" é comportamento do
      provider e do manifesto, não expressável em teste unitário do núcleo.
    mitigation: >-
      Revisão manual: o painel consome o último resultado do Doctor (PROJ-006) e
      a última medição; abrir o painel não dispara diagnóstico nem medição.

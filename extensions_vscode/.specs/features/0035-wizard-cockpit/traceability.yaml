# Itens sem cobertura automatizada, registrados explicitamente em vez de
# omitidos.
gaps:
  - id: "NFR-WIZ-002 (estética da camada de marca)"
    reason: >-
      A fidelidade visual e o acabamento estético da camada de marca em cada tema só
      são plenamente verificáveis por revisão humana; TEST-WIZ-016 cobre apenas um
      smoke de contraste/operação.
    mitigation: >-
      Capturas nos temas claro e escuro anexadas como evidência da TASK-WIZ-015, além
      do smoke TEST-WIZ-016, comparadas aos mockups de docs/ui-redesign/.
  - id: "TEST-WIZ-006/007/008 (render, reidratação e avanço no host)"
    reason: >-
      O render do shell/stepper/rodapé no WebviewPanel, a CSP em runtime, a reidratação
      por edição externa e o ciclo cliente→host do avanço (botão → applyTransition →
      status.yaml) exigem o host do VS Code (vscode-test). As partes puras (documento
      HTML+CSP, modelo, guardas, alvo de transição, montagem de artefatos) já têm testes.
    mitigation: >-
      Executar os e2e TEST-WIZ-006/007/008 no host; até lá, cobertura unitária de
      renderWizardHtml, wizardModel, wizardStepGuards (incl. advanceTargetStatus) e
      wizardArtifacts, e a reutilização de applyTransition (já coberto pelo E2E 0032).

# Histórico de transições. Só acrescenta; nunca reescreve.
history:
  - status: DRAFT
    date: "2026-08-05"
    reason: >-
      Feature criada a partir do pedido de tornar a GUI da extensão profissional
      com um wizard guiado. Mockups (14 telas), design system e plano de
      implementação já entregues em docs/ui-redesign/ e aprovados pelo usuário.
  - status: CLARIFIED
    date: "2026-08-05"
    reason: >-
      Questões Q2–Q6 resolvidas pelo usuário via /sdd-kit:clarify (escopo da 1ª
      entrega = wizard primeiro; gestão = criar/conduzir/arquivar; Claude Code
      ausente = copiar prompt e instruir; tema claro desde já; QuickPick mantido
      em paralelo). Nenhuma questão crítica em aberto.
  - status: DESIGNED
    date: "2026-08-05"
    reason: >-
      Design técnico gerado e 3 ADRs registrados: ADR-033 (wizard como WebviewPanel
      interativo, estende ADR-024), ADR-034 (esbuild + Preact para o webview do
      wizard, resolve A1 no escopo do wizard) e ADR-035 (camada de marca --sdd-*
      derivada do tema). Nenhuma questão crítica em aberto.
  - status: PLANNED
    date: "2026-08-05"
    reason: >-
      Plano gerado com 15 tarefas (1 P, 14 M, 0 G), caminho crítico
      TASK-WIZ-003→005→006→007→011→014. Matriz de rastreabilidade criada: os 6
      requisitos e os 4 NFRs cobertos por tarefa e teste, sem tarefa órfã nem
      dependência inválida. Transição DESIGNED → PLANNED válida.
  - status: IN_PROGRESS
    date: "2026-08-05"
    reason: >-
      Implementação iniciada a pedido do usuário pela fundação. TASK-WIZ-001
      (themeTokens, tokens --sdd-* derivados de --vscode-* + paleta de marca)
      concluída: compile ok, 4 testes ok (TEST-WIZ-001), lint limpo. A etapa
      approve do fluxo não foi executada (approval permanece null): o skill
      /sdd-kit:approve não está disponível nesta sessão. TASK-WIZ-010 (ações de IA)
      implementada em seguida: runHybridStep extraído de extension.ts para o serviço
      reusável hybridStep.ts, mapa puro etapa → ação em wizardActions.ts, mensagem {ai}
      na borda e botão no cliente. compile ok, 208 testes de unidade ok, lint limpo. O
      e2e TEST-WIZ-011 está escrito mas NÃO foi executado: o VS Code headless não sobe
      neste ambiente (libnspr4.so ausente) — registrado como gap na traceability.
      TASK-WIZ-011 (views de conteúdo) implementada em seguida: wizardContent.ts extrai
      requisitos, dúvidas, ADRs e tarefas dos artefatos; StageView roteia; as views
      Especificar/Clarificar/Desenhar/Tarefas exibem o conteúdo com a ação de IA. Achado
      e corrigido no caminho: um import de VALOR de wizardContent num componente arrastou
      o js-yaml para o bundle do webview (21 kB → 136 kB, contra o "bundle leve" do
      ADR-034); a derivação passou ao host e o esbuild agora falha acima de 60 kB.
      compile ok, 218 testes de unidade ok, lint limpo. TASK-WIZ-009 (hub) implementada
      em seguida: wizardHub.ts agrupa as mudanças reusando groupByStatus, o payload passa
      a declarar o modo (hub | change), e openWizard sem nó abre o hub em vez do
      QuickPick. compile ok, 225 testes de unidade ok, lint limpo, bundle 32,3 kB. O e2e
      TEST-WIZ-010 cobre o SCN-WIZ-011 (hub abre sem QuickPick em projeto vazio) mas
      segue sem execução local pelo mesmo bloqueio de ambiente.

      Rodada de CI verde em 2026-08-05 (run 31041744209): os 10 e2e passaram sob xvfb,
      incluindo os três novos — TEST-WIZ-010 (o hub abre sem QuickPick em projeto vazio,
      SCN-WIZ-011) e TEST-WIZ-011 (a ação de etapa compõe e copia /sdd-kit:<ação> <id>,
      SCN-WIZ-004/012). Com a evidência de execução, TASK-WIZ-009 e TASK-WIZ-010 passam a
      done. As TASK-WIZ-005/006/007 permanecem in_progress: os e2e delas (TEST-WIZ-006/007/008)
      nunca foram ESCRITOS, e CI verde não supre teste inexistente. TASK-WIZ-008 segue parcial
      (falta o formulário) e TASK-WIZ-011 aguarda as capturas das quatro views.


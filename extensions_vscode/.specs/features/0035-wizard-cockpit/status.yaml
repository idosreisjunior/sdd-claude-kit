# Questões já resolvidas.
resolved_questions:
  - question: Q1
    date: "2026-08-05"
    resolved_by: clarify
    summary: >-
      Stack do webview do wizard: esbuild + Preact (bundle leve só para o wizard;
      painéis de leitura permanecem em vanilla). Formalizado em ADR-034.
  - question: Q2
    date: "2026-08-05"
    resolved_by: clarify
    summary: >-
      Tema claro suportado desde já: as cores derivam de variáveis --vscode-* via a
      camada de tokens --sdd-* (ADR-035); validar contraste no polimento.
  - question: Q3
    date: "2026-08-05"
    resolved_by: clarify
    summary: >-
      Primeira entrega = o wizard completo (criar → conduzir → verificar). O
      redesenho de Board e sidebar fica para uma iteração seguinte.
  - question: Q4
    date: "2026-08-05"
    resolved_by: clarify
    summary: >-
      O newFeature por QuickPick é mantido em paralelo como fallback até a etapa
      Solicitar do wizard estar verificada; não é aposentado de imediato.
  - question: Q5
    date: "2026-08-05"
    resolved_by: clarify
    summary: >-
      Quando o Claude Code não é detectado no PATH, a ação de IA copia o prompt para
      a área de transferência e mostra como instalar/configurar o caminho (reusa o
      adapter da feature 0004).
  - question: Q6
    date: "2026-08-05"
    resolved_by: clarify
    summary: >-
      "Gerenciar" abrange criar, retomar, avançar etapas e arquivar (estado terminal
      do fluxo). Excluir e renomear ficam fora do escopo (identificadores são
      permanentes; renomear quebraria a rastreabilidade).


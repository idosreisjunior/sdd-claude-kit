    date: "2026-08-03"
    reason: >-
      Verificação por evidência (build e lint limpos; suíte 136/136 via node --test). REQ-CLAR-001/002 e NFR-CLAR-001/003 atendidos: a pré-condição (spec com REQ-*) é núcleo puro testado (clarifyGenerator.test.ts, TEST-CLAR-001); o esqueleto com as nove categorias do RF-008 vem do template feature/clarifications.md montado por skeleton.ts, coberto por TEST-CLAR-002 (nove seções, sem marcador residual). A ação Clarificar vive no item da feature, não promove estado e reusa a ação clarify do adapter 0004 (ADR-015). Confirmação de sobrescrita, não-promoção e compatibilidade de caminhos são integração de host, registradas em traceability.yaml gaps com mitigação por revisão manual; a análise assistida por IA ativa-se na Fase 2 (skill /sdd-kit:clarify), fora do escopo do critério local. Q1/Q2 resolvidas por ADR-015; sem questão bloqueante.

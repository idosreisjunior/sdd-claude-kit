      tarefa); sem órfã, ciclo ou tarefa G.
  - status: IN_PROGRESS
    date: "2026-08-04"
    reason: >-
      Implementado. boardModel.ts: orderColumns (ordena por rótulo, anexa o resto, ignora ausentes) e
      moveColumn (move uma posição, respeita bordas), puros. boardHtml.ts: state.columnOrder lido/gravado

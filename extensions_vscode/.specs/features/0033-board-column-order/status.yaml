      Criada por /sdd-kit:new: reordenar as colunas do kanban (setas ◂/▸ no cabeçalho, reset e
      persistência). Setas em vez de arrastar, para não conflitar com o arrastar de cartões. Lógica
      pura como no resto do painel. Questões em TASK-COLORD-001 (ADR-031).
  - status: PLANNED
    date: "2026-08-04"
    reason: >-
      Plano gerado por /sdd-kit:tasks (3 tarefas P; caminho crítico TASK-COLORD-001 → 002 → 003).

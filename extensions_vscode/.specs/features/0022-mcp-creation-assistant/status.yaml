# Histórico de transições. Só acrescenta; nunca reescreve.
# `reason` é obrigatório e não pode ser vazio: uma transição sem motivo
# registrado é indistinguível de uma mudança acidental de estado.
history:
  - status: DRAFT
    date: "2026-08-02"
    reason: >-
      Criada por /sdd-kit:new para materializar o RF-025 (assistente de criação
      de servidores MCP) — requisito pós-MVP do PRD da extensão, sem cobertura no
      index.yaml. Rascunho: um requisito real (conduzir pelos 9 aspectos) e as
      questões de mecanismo/saída/escopo (Q1..Q6) em aberto.
  # /sdd-kit:spec (refinamento) não altera o estado — apenas registra as decisões.
  # Q1/Q2 confirmadas pelo usuário (padrão híbrido; saída = documento mcp.md);
  # Q3/Q4/Q5/Q6 decorrem delas. Ver "Decisões de escopo" na spec.
  - status: PLANNED
    date: "2026-08-02"
    reason: >-
      Plano gerado por /sdd-kit:tasks a partir dos requisitos (3 tarefas: 1 P,
      2 M; TASK-MCP-001 e 002 paralelizáveis; caminho crítico TASK-MCP-002 →
      003). Transição DRAFT → PLANNED com CLARIFIED e DESIGNED pulados, confirmada
      pelo usuário: as skills clarify e design chegam na Fase 2. Q1/Q2 decididas na
      spec (padrão híbrido; saída = documento mcp.md) e Q3..Q6 decorrem; a
      formalização do mecanismo e do novo action `mcp` fica em ADR-021 (TASK-MCP-001).
      Cobertura completa (3 requisitos com tarefa); sem requisito descoberto, tarefa
      órfã, ciclo ou tarefa G.
  - status: IN_PROGRESS
    date: "2026-08-03"
    reason: >-
      Implementação já concluída fora da ordem formal do fluxo — as 3 tarefas do plano estavam done com os testes passando — enquanto approve e verify eram tratados como Fase 2. PLANNED to IN_PROGRESS registrada para refletir o trabalho de implementação executado antes da verificação; approve permanece pulado (approval segue null), no mesmo padrão da 0010-publishing.
  - status: VERIFIED
    date: "2026-08-03"
    reason: >-
      Verificação por evidência (build e lint limpos; suíte 136/136 via node --test). Os nove aspectos do RF-025 vivem na fonte única MCP_ASPECTS (mcpAspects.ts) e no template feature/mcp.md, na ordem do texto — TEST-MCP-001 fixa a lista e a ordem; TEST-MCP-002 confirma que aspectos sem decisão são marcados como pendentes e o documento é produzido sem lançar. O núcleo é puro, sem vscode ou IO (NFR-MCP-001). A borda launchClaudeAction (extension.ts) copia o prompt e o deixa pronto no terminal sem enviar (SCN-MCP-003) e, sem a CLI, copia e orienta (SCN-MCP-004); o action mcp é coberto por TEST-MCP-003 (composePrompt to /sdd-kit:mcp). A elaboração assistida ponta a ponta depende da skill /sdd-kit:mcp (Fase 2), registrada no ADR-021, fora do escopo desta mudança. Q1 resolvida por ADR-021; nenhuma questão em aberto.
  - status: ARCHIVED
    date: "2026-08-03"
    reason: >-
      Arquivada após verificação: a mudança está concluída e faz parte da extensão publicada (v0.2.1). Transição de VERIFIED para ARCHIVED (estado terminal), movendo-a ao grupo Concluídas do painel; os artefatos permanecem em .specs/features para rastreabilidade e os identificadores nunca são reutilizados. Sem alteração de código.


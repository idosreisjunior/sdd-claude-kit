# Histórico de transições. Só acrescenta; nunca reescreve.
# `reason` é obrigatório e não pode ser vazio: uma transição sem motivo
# registrado é indistinguível de uma mudança acidental de estado.
history:
  - status: DRAFT
    date: "2026-08-02"
    reason: >-
      Criada por /sdd-kit:new para materializar o RF-010 (geração de tarefas) —
      requisito pós-MVP sem cobertura no index.yaml. Rascunho com objetivo e
      contexto derivados da solicitação. A geração já existe (/sdd-kit:tasks +
      ação tasks do 0004); o incremento novo é a análise do tasks.md.
  - status: PLANNED
    date: "2026-08-02"
    reason: >-
      Plano gerado por /sdd-kit:tasks a partir dos requisitos (3 tarefas: 1 P,
      2 M; caminho crítico linear TASK-TGEN-001 → 002 → 003). Transição
      DRAFT → PLANNED com CLARIFIED e DESIGNED pulados, confirmada pelo usuário:
      as skills clarify e design chegam na Fase 2. O plano não considera design
      técnico — Q1 (superfície) e Q3 (parser) são resolvidas em TASK-TGEN-001
      (ADR-018). Cobertura completa (5 requisitos com tarefa); sem requisito
      descoberto, tarefa órfã, ciclo ou tarefa G. Não depende da Fase 2.
  - status: IN_PROGRESS
    date: "2026-08-03"
    reason: >-
      Implementação já concluída fora da ordem formal do fluxo — as 3 tarefas do plano estavam done com os testes passando — enquanto approve e verify eram tratados como Fase 2. PLANNED to IN_PROGRESS registrada para refletir o trabalho de implementação executado antes da verificação; approve permanece pulado (approval segue null), no mesmo padrão da 0010-publishing.
  - status: VERIFIED
    date: "2026-08-03"
    reason: >-
      Verificação por evidência (build e lint limpos; suíte 136/136 via node --test). REQ-TGEN-001 (SCN-TGEN-001) e SCN-TGEN-002/003 atendidos pelo núcleo puro analyzeTasks (taskAnalysis.ts), que sinaliza tarefas de complexidade G e campos obrigatórios ausentes, cobertos por TEST-TGEN-001 e TEST-TGEN-002 (asserts sobre kind, taskId e linha, e sobre nenhum achado quando completo). A borda analyzeTasksCommand (extension.ts) publica os achados no painel Problems (ADR-018), trata a ausência de tasks.md (SCN-TGEN-004) e oferece gerar via launchClaudeAction(id, 'tasks') to /sdd-kit:tasks (REQ-TGEN-002, SCN-TGEN-005). NFR-TGEN-001/002/003 satisfeitos (núcleo puro, somente leitura). Gaps de apresentação e atalho, e o gap framework-para-template do 11 campo (D-Q2b), registrados em traceability.yaml com mitigação manual. Q1/Q3 resolvidas por ADR-018; sem bloqueio.


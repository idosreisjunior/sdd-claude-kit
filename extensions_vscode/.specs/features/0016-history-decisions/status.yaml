# Estado da mudança. Forma válida: plugins/sdd-kit/schemas/status.schema.json
#
# Datas SEMPRE entre aspas: sem elas o YAML produz um objeto data e a
# validação por schema falha. Ver standards.md §9.
version: 1

id: "0016-history-decisions"
# feature | bug | refactor | change
type: "feature"
title: "Histórico e decisões (RF-020)"

# Toda mudança nasce em DRAFT.
status: PLANNED

created: "2026-08-01"
updated: "2026-08-01"

# Histórico de transições. Só acrescenta; nunca reescreve.
# `reason` é obrigatório e não pode ser vazio: uma transição sem motivo
# registrado é indistinguível de uma mudança acidental de estado.
history:
  - status: DRAFT
    date: "2026-08-01"
    reason: >-
      Criada por /sdd-kit:new para materializar o RF-020 (histórico e decisões)
      — requisito pós-MVP sem cobertura no index.yaml. Rascunho com objetivo e
      contexto derivados da solicitação; o subconjunto viável do histórico e a
      criação de ADRs registrados como questões pendentes. Detalhar com
      /sdd-kit:spec.
  - status: PLANNED
    date: "2026-08-01"
    reason: >-
      Plano gerado por /sdd-kit:tasks a partir dos requisitos (4 tarefas: 1 P,
      3 M; TASK-HIST-002 e 003 paralelizáveis após o ADR). Transição
      DRAFT → PLANNED com CLARIFIED e DESIGNED pulados, confirmada pelo usuário:
      as skills clarify e design chegam na Fase 2. O plano não considera design
      técnico — Q2 e Q5 são resolvidas em TASK-HIST-001 (ADR-016). Cobertura
      completa (5 requisitos com tarefa); sem requisito descoberto, tarefa órfã,
      ciclo ou tarefa G. Diferente do 0014/0015, não depende da Fase 2.

# null significa NÃO APROVADO. Preenchido por /sdd-kit:approve com
# {date, by, revision}.
approval: null

# Bloqueios ativos. Lista vazia significa sem bloqueio.
# Q1/Q3/Q4 decididas na spec (Decisões de escopo). Q2 e Q5 resolvidas por
# TASK-HIST-001 (ADR-016). Sem bloqueio pendente.
blocked_by: []

# Questões já resolvidas. Preservadas em vez de apagadas: uma decisão sem
# rastro é indistinguível de uma suposição — ver constitution.md, Art. 5.
resolved_questions:
  - question: Q2
    date: "2026-08-01"
    resolved_by: TASK-HIST-001
    summary: >-
      O histórico é apresentado num WebviewPanel read-only (CSP+nonce), no padrão
      de 0008/0009; o render (historyHtml.ts) é puro e testável.
    adr: ADR-016
  - question: Q5
    date: "2026-08-01"
    resolved_by: TASK-HIST-001
    summary: >-
      O "Novo ADR" aloca o número varrendo os decisions/ de todas as mudanças
      (max+1, via nextAdrNumber) e deriva o slug com adrSlug (determinístico,
      como sanitizeSlug); sem sobrescrever arquivo existente.
    adr: ADR-016

# Contadores derivados de tasks.md. total = pending + in_progress + done.
tasks:
  total: 4
  pending: 0
  in_progress: 0
  done: 4

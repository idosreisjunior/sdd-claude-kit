    reason: >-
      Criada por /sdd-kit:new para materializar o RF-024 (SQL Guard) — requisito
      pós-MVP sem cobertura no index.yaml. Rascunho: das 11 categorias, só o
      subconjunto heurístico é realizável; as demais exigem parser + esquema.
  - status: PLANNED
    date: "2026-08-02"
    reason: >-
      Plano gerado por /sdd-kit:tasks a partir dos requisitos (3 tarefas: 1 P,
      2 M; caminho crítico linear TASK-SQL-001 → 002 → 003). Transição
      DRAFT → PLANNED com CLARIFIED e DESIGNED pulados, confirmada pelo usuário:
      as skills clarify e design chegam na Fase 2. Q1/Q2/Q5/Q6 decididas na spec
      (subconjunto heurístico de 4 verificações, editor SQL, sem dependência,
      dialeto-agnóstico); Q3 (superfície) e Q4 (gatilho) são de design, em

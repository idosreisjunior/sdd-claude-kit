gaps:
  - id: "REQ-FILTER-003"
    reason: >-
      A persistência da barra/foco e a re-renderização só da área do board são
      comportamento de DOM no host, não coberto por teste unitário; a lógica de
      filtro é pura e testada.
    mitigation: >-
      Revisão manual (TASK-FILTER-003): com um filtro ativo e a busca em foco,
      salvar um .specs mantém o filtro, a barra e o foco.
  - id: "NFR-FILTER-002"
    reason: >-
      "Client-side, CSP preservada" é propriedade do render do webview; abrir o
      painel é coberto por E2E (0025), o render por revisão.
    mitigation: >-
      Revisão de código (sem innerHTML; CSP com nonce mantida).

# Histórico de transições. Só acrescenta; nunca reescreve.
history:
  - status: DRAFT
    date: "2026-08-05"
    reason: >-
      Criada a partir do relato do usuário de que a interface "ainda está a mesma coisa"
      após instalar a 0.3.0-preview.3, com o pedido de que a extensão pareça um sistema
      desktop. Constatação verificada no repositório: os sete módulos de HTML de painel
      usam --vscode-* diretamente e nenhum consome a camada --sdd- criada na 0035. É a
      iteração que a questão Q3 da 0035 adiou de forma registrada. Entre as leituras
      possíveis de "sistema desktop", o usuário escolheu redesenhar as telas existentes e
      pediu spec antes do código.
  - status: CLARIFIED
    date: "2026-08-05"
    reason: >-
      Questões Q1–Q6 resolvidas pelo usuário via /sdd-kit:clarify. Nenhuma questão crítica
      permanece em aberto. As decisões ampliaram o alcance: a sidebar deixa de ser
      TreeView e vira webview (Q1), os sete painéis migram para esbuild + Preact (Q2) com
      uma biblioteca interna de componentes (Q3), as boas-vindas saem do viewsWelcome (Q4)
      e os quatro painéis sem mockup entram por analogia (Q6). O redesenho segue
      estritamente visual (Q5). O refinamento seguinte por /sdd-kit:spec detectou uma
      contradição entre Q4 e Q5 e a registrou como Q7, resolvida na sequência: as
      boas-vindas viram um estado da sidebar, cumprindo Q4 sem violar Q5.
  - status: DESIGNED
    date: "2026-08-05"
    reason: >-
      Design técnico gerado com dois ADRs. ADR-036 (sidebar como WebviewView) formaliza Q1
      e a responsabilidade que vem junto — teclado, seleção, ações por item e revelar-item
      deixam de vir da plataforma. ADR-037 (bundler e biblioteca de componentes para todos
      os painéis) formaliza Q2 e Q3, estende o ADR-034 e REVISA uma recusa explícita dele
      ("bundler para todos os painéis — reescreveria superfícies estáveis sem ganho"): a
      premissa caiu porque a 0036 reescreve essas superfícies de qualquer forma. Fecha a
      questão arquitetural A1 para a extensão inteira. A migração é incremental painel a
      painel, com os testes existentes como contrato imutável, e a sidebar vai por último
      por ser o passo de maior risco. Nenhuma questão bloqueante em aberto.
  - status: PLANNED
    date: "2026-08-05"
    reason: >-
      Plano gerado com 20 tarefas (6 P, 14 M, 0 G), caminho crítico TASK-COCK-001 → 002 →
      003 → 009 → 016 → 017 → 019 → 020. As três verificações de consistência passaram:
      nenhum dos 11 requisitos ficou descoberto, nenhuma tarefa órfã, nenhuma dependência
      inválida e nenhum ciclo. O Board foi dividido em três tarefas (casca, interações,
      feed) porque como tarefa única seria G, e nenhuma G pode sobreviver ao plano. A
      sidebar depende de TASK-COCK-009 de propósito: o design manda exercitar a biblioteca
      de componentes em painéis reais antes de encarar o passo de maior risco. Matriz de
      rastreabilidade criada com implementation vazio e 4 lacunas registradas.

  - status: APPROVED
    date: "2026-08-05"
    reason: >-
      Aprovada pelo usuário com a autorização explícita "pode implementar", sobre o plano de
      20 tarefas gerado em 75e6e98. Registrada aqui à mão porque o skill /sdd-kit:approve
      não está disponível nesta sessão — o campo approval traz a origem da aprovação em vez
      de simular a passagem pelo skill. O usuário está ciente do alcance: substituir a
      TreeView da sidebar e reescrever sete painéis cobertos por teste.

  - status: IN_PROGRESS
    date: "2026-08-05"
    reason: >-
      Fundação implementada: TASK-COCK-001 (esbuild com um bundle por superfície, teto
      verificado por build falhando), TASK-COCK-002 (renderPanelHtml — ponto único de
      CSP/nonce/escape, 7 testes), TASK-COCK-004 (teste-guarda, verificado VERMELHO listando
      73 declarações infratoras em 9 módulos) e TASK-COCK-005 (78 substituições levando o
      guarda ao verde). A camada de tokens foi estendida com 12 tokens de conteúdo e o
      --sdd-on-brand, porque os painéis usavam variáveis --vscode-* sem token correspondente
      e sem eles não haveria como consumir a camada. A regra do design §11 se sustentou:
      nenhum arquivo de teste existente foi modificado. compile ok, 234 testes ok, lint
      limpo, bundle 32,3 kB. TASK-COCK-003 em seguida: biblioteca de seis componentes em
      src/webview/ui/, com as decisões em src/sdd/uiModel.ts porque src/webview está fora do
      tsc (ADR-034) e componente .tsx não é alcançável por node --test. O critério original
      da tarefa ("nenhum componente importa valor de src/sdd/") era estrito demais e proibia
      o próprio padrão: foi corrigido para a regra real — o que a importação ARRASTA —,
      verificada por medição (bundle de prova com os seis componentes: 20 kB, sem js-yaml).
      242 testes ok. TASK-COCK-011 (histórico) em seguida, e com ela um ADR novo: ao
      começar a migração descobriu-se que histórico, métricas e validação rodam com
      enableScripts: false por decisão do ADR-016 — postura MAIS forte que CSP+nonce.
      Migrá-los para Preact como o ADR-037 mandava exigiria ligar scripts e violaria
      NFR-COCK-002. Interrompido e levado ao usuário, que escolheu preservar a postura:
      ADR-038 restringe o ADR-037 às superfícies interativas e dá aos painéis de leitura a
      identidade pelo CSS compartilhado, via renderStaticPanelHtml (CSP sem script-src).
      Histórico redesenhado a partir do bloco de linha do tempo do mockup 13, com a origem
      declarada no módulo (REQ-COCK-007). TASK-COCK-012 (métricas, derivada do mockup 13) e
      TASK-COCK-013 (validação, derivada do mockup 12) na sequência, mesma abordagem sem
      script. Duas correções de segurança no caminho: (1) estilo INLINE não passa na CSP com
      nonce — nonce autoriza elementos <style>, atributos style= exigiriam unsafe-inline —,
      então as cores de status viraram classes emitidas no bloco com nonce e a largura da
      barra de métricas também; (2) o guarda de tokens só olhava hex e deixava passar
      rgba() literal, que o validationHtml usava em três lugares: foi estendido para
      rgb/rgba/hsl/hsla e passou a ignorar comentários, depois de acusar a si mesmo. Ambos
      verificados por injeção de infração real. TASK-COCK-006/007 (Board) em seguida, e com
      elas o ADR-039: os cinco asserts de boardHtml.test.ts descrevem o MECANISMO de entrega
      (script inline, #app, const INITIAL), e migrar para Preact exigiria reescrevê-los — a
      regressão que o design §11 proíbe. Levado ao usuário, que escolheu não migrar: o Board
      mantém o cliente inline e recebe a identidade pelas classes compartilhadas. Risco de
      regressão nas seis funcionalidades cai a zero e os cinco asserts seguem intactos. A
      007 deixou de ser reimplementação e virou verificação. 257 testes ok, nenhum arquivo
      de teste existente alterado, lint limpo. Ao seguir, o levantamento completo das
      superfícies mostrou que visão do projeto e dashboard de feature TAMBÉM rodam com
      enableScripts: false — a terceira exceção que o próprio ADR-039 elegeu como gatilho
      para reconsiderar o ADR-037 por inteiro. Feito: ADR-040 SUBSTITUI o ADR-037 e registra
      a regra que a realidade impôs — a identidade vem do CSS compartilhado, que serve a
      todas as superfícies, e cliente existe só onde há interação. TASK-COCK-008/009/010
      concluídas como restilo: feed do Board, dashboard e visão do projeto passam a usar
      ui-card e ui-tile. Dois defeitos latentes corrigidos no caminho: o status do feed usava
      uma classe .badge que não existia no CSS do Board (sem estilo desde a 0029), e o
      contador do dashboard precisou continuar em div e não span porque TEST-UI-002 afirma
      ">N</div>" — adaptei o código ao contrato, não o teste ao código. TASK-COCK-014
      (editor de spec) restilado pelo mesmo critério: já tem cliente inline e testes de
      mecanismo, então não migra. TASK-COCK-015 entregou sidebarModel.ts — o estado que a
      TreeView resolvia sozinha (foco, seleção, navegação) vira núcleo puro com 13 testes,
      incluindo o que a TreeView fazia de graça e ninguém perdoaria perder: reidratar sem
      jogar o usuário de volta ao topo. 270 testes ok. ACHADO para o próximo passo: a
      sidebar tem 18 ações por item (2 inline + 16 em submenu) que o SCN-COCK-008 exige
      preservar — número maior do que a decisão Q1 deixava aparente.


# Itens sem cobertura automatizada, registrados explicitamente em vez de
# omitidos. Um requisito que só dá para verificar por revisão humana continua
# sendo um requisito — o que não pode é a lacuna ficar invisível.
gaps:
  - id: "NFR-COCK-001 (contraste e fidelidade visual)"
    reason: >-
      Contraste percebido e correspondência ao mockup não são verificáveis por teste
      automatizado: exigem olho humano sobre a tela renderizada, nos dois temas. Um teste
      que medisse razão de contraste sobre os tokens não capturaria composição, densidade
      nem hierarquia — daria cobertura aparente.
    mitigation: >-
      TASK-COCK-019 exige captura de cada superfície nos temas claro e escuro, comparadas
      aos mockups de docs/ui-redesign/, como evidência de conclusão.

  - id: "REQ-COCK-003/004/007 (fidelidade ao mockup)"
    reason: >-
      "Corresponde ao mockup" é juízo visual. Os testes cobrem o que é objetivo —
      comportamento preservado, tokens aplicados, origem do layout declarada — mas não a
      semelhança com o desenho aprovado.
    mitigation: >-
      Captura por superfície comparada ao mockup correspondente, exigida no critério de
      conclusão de cada tarefa de migração; a derivação declarada (REQ-COCK-007) torna a
      escolha de layout conferível por outra pessoa.

  - id: "Render dentro do webview (todas as superfícies)"
    reason: >-
      O DOM de um webview não é alcançável pelo host da extensão. Nenhum teste
      automatizado pode afirmar "a view listou os requisitos" ou "o cartão mostrou o
      badge" — limite de plataforma já registrado na feature 0035 e que continua valendo.
    mitigation: >-
      Cobertura do que é alcançável: o payload emitido (TEST-COCK-002), o núcleo puro
      (TEST-COCK-005/006), os componentes com lógica (TEST-COCK-003/004) e o efeito
      observável no host (TEST-COCK-007/008/009). O resto é revisão humana com captura.

  - id: "TEST-COCK-007/008/009 (e2e no host)"
    reason: >-
      Os e2e exigem o Extension Development Host e não sobem no ambiente de
      desenvolvimento em WSL (libnspr4.so ausente) — mesma limitação registrada na 0035.
    mitigation: >-
      A CI executa `xvfb-run -a npm run test:e2e` (.github/workflows/ci.yml). Localmente,
      verificação manual pelo F5 seguindo os critérios de conclusão das tarefas.

      a Q1 (webview vs. custom editor). Segue em DRAFT — requisitos a detalhar e
      três questões em aberto (Q1 alta).
  - status: CLARIFIED
    date: "2026-07-31"
    reason: >-
      Q1 (alta), Q2 (média) e Q3 (baixa) resolvidas por ADR-005: webview panel para
      o dashboard read-only; contagens de fontes estruturadas (status.yaml,
      traceability.yaml, spec.md); sem botões de ação neste incremento. Nenhuma
      questão em aberto.
  - status: DESIGNED
    date: "2026-07-31"
    reason: >-
      Design registrado em ADR-005: base webview + modelo puro (dashboardModel) e
      render puro com CSP/nonce (dashboardHtml), lidos via workspace.fs. Fronteira
      de módulos coerente com a arquitetura (views → core → arquivos).
  - status: PLANNED
    date: "2026-07-31"
    reason: >-
      tasks.md gerado — 7 tarefas (UI-001..007) ligadas a REQ-UI-001..003 e às NFR
      em traceability.yaml; TASK-UI-001 (ADR-005) concluída. Sem dependência
      inválida nem requisito sem cobertura. Aguardando revisão/aprovação antes da
      implementação.
  - status: IN_PROGRESS
    date: "2026-07-31"
    reason: >-
      Implementação do incremento a pedido do usuário. UI-002 (dashboardModel) e
      UI-003 (dashboardHtml) concluídas e testadas (TEST-UI-001/002, 8 casos);
      UI-004 (webview + comando openDashboard) e UI-005 (ação no painel) com código
      pronto, aguardando verificação no host; UI-007 (gate) verde — compile/lint
      exit 0, npm test 42/42. Integração model+HTML com os artefatos reais confere.
      Resta a verificação no host (F5, UI-006) para caminhar a VERIFIED.
  - status: VERIFIED
    date: "2026-07-31"
    reason: >-
      Verificação no host (F5) D1–D5 ✅ em evidence.md, sem divergência: abrir o
      dashboard, conteúdo correto (progresso e contagens), reuso do painel, campos
      pendentes e robustez a artefato ausente. UI-004/005/006 concluídas — 7/7

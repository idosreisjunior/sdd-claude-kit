    date: "2026-08-04"
    reason: >-
      Verificação por evidência: compile e lint limpos; suíte unitária 161 (+2): TEST-FEED-001
      (buildActivityFeed agrega as transições, mais recente primeiro, com id/estado/data/motivo —

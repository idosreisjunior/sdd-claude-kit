  - status: DRAFT
    date: "2026-08-04"
    reason: >-
      Criada por /sdd-kit:new: um feed de atividade no Painel SDD, como na SDD Builder AI, derivado do
      history: de todos os status.yaml (transições do projeto). Questões de design em TASK-FEED-001
      (ADR-027).
  - status: PLANNED
    date: "2026-08-04"
    reason: >-
      Plano gerado por /sdd-kit:tasks (3 tarefas: 2 P, 1 M; caminho crítico TASK-FEED-001 → 002 → 003).
      CLARIFIED/DESIGNED pulados (Fase 2): design em ADR-027. Cobertura completa (4 requisitos com
      tarefa); sem órfã, ciclo ou tarefa G.
  - status: IN_PROGRESS
    date: "2026-08-04"
    reason: >-
      Implementado. boardModel.ts: FeedItem/FeedSource, parsing robusto do history:, buildActivityFeed
      (agrega as transições de todas as mudanças, ordena por data desc, limita a 50). boardPanel.ts:

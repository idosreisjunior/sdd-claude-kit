      Segue em DRAFT — três questões em aberto, sendo Q1 (base do editor) alta e
      candidata a ADR.
  - status: CLARIFIED
    date: "2026-07-31"
    reason: >-
      Q1 (alta), Q2 (média) e Q3 (média) resolvidas por ADR-006: base
      CustomTextEditor (prioridade option) para spec.md, sync sem perda; só spec.md
      no primeiro incremento; formulário estruturado sem parse frágil (futuro).
      Nenhuma questão em aberto.
  - status: DESIGNED
    date: "2026-07-31"
    reason: >-
      Design registrado em ADR-006: CustomTextEditor com render SDD-aware puro
      (specView), HTML do webview puro com CSP/nonce (specEditorHtml) e sync por
      WorkspaceEdit no provider (specEditor). Fronteira coerente com a arquitetura.
  - status: PLANNED
    date: "2026-07-31"
    reason: >-
      tasks.md gerado — 7 tarefas (EDIT-001..007) ligadas a REQ-EDIT-001..003 e às

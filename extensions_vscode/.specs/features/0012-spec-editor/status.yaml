    reason: >-
      Criada para iniciar o RF-006 (editor visual), o incremento seguinte da
      Interface após o dashboard (RF-005, entregue e verificado na 0003). Modelada
      como mudança própria por decisão do usuário (a 0003 permanece VERIFIED). Spec

      implementação.
  - status: IN_PROGRESS
    date: "2026-07-31"
    reason: >-
      Implementação do incremento a pedido do usuário. EDIT-002 (specView) e EDIT-003
      (specEditorHtml) concluídas e testadas (TEST-EDIT-001/002, 7 casos); EDIT-004
      (CustomTextEditorProvider + sync) e EDIT-005 (ação no painel) com código pronto,
      aguardando verificação no host; EDIT-007 (gate) verde — compile/lint exit 0,
      npm test 49/49. Integração do HTML do editor com o spec.md real confere.
      Resta a verificação no host (F5, EDIT-006) para caminhar a VERIFIED.


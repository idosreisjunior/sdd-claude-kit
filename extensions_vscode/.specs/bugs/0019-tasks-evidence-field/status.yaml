# Estado da mudança. Forma válida: plugins/sdd-kit/schemas/status.schema.json
#
# Datas SEMPRE entre aspas: sem elas o YAML produz um objeto data e a
# validação por schema falha. Ver standards.md §9.
version: 1

id: "0019-tasks-evidence-field"
# feature | bug | refactor | change
type: "bug"
title: "Template tasks.md sem o campo 'evidências necessárias' (RF-010)"

# Verificada em 2026-08-03: a correção existente foi conferida contra os
# critérios de aceite (evidência no history). approve segue pulado (Fase 2).
status: VERIFIED

created: "2026-08-02"
updated: "2026-08-03"

# Histórico de transições. Só acrescenta; nunca reescreve.
# `reason` é obrigatório e não pode ser vazio: uma transição sem motivo
# registrado é indistinguível de uma mudança acidental de estado.
history:
  - status: DRAFT
    date: "2026-08-02"
    reason: >-
      Criada por /sdd-kit:new. Bug descoberto na implementação do 0018 (D-Q2b): o
      template _shared/tasks.md tem 10 dos 11 campos que o RF-010 exige — falta
      "evidências necessárias". A correção acrescenta o campo ao template-fonte e
      sincroniza. Causa raiz conhecida; reprodução direta.
  - status: PLANNED
    date: "2026-08-02"
    reason: >-
      Plano gerado por /sdd-kit:tasks (1 tarefa P: acrescentar a seção
      `### Evidências necessárias` ao template + sync + teste de regressão).
      Transição DRAFT → PLANNED com CLARIFIED e DESIGNED pulados, confirmada pelo
      usuário: as skills chegam na Fase 2 e, para um bug pequeno, o design é
      dispensável. Q1 (formato) decidida na spec. Cobertura: a regra violada
      (RF-010) via SCN-TEVF-001/002; sem tarefa órfã, ciclo ou tarefa G.
  - status: IN_PROGRESS
    date: "2026-08-03"
    reason: >-
      Correção já implementada e testada fora da ordem formal do fluxo (a única tarefa do plano estava done), enquanto approve e verify eram tratados como Fase 2. PLANNED to IN_PROGRESS registrada para refletir o trabalho executado antes da verificação; approve permanece pulado (approval segue null), no padrão da 0010-publishing.
  - status: VERIFIED
    date: "2026-08-03"
    reason: >-
      Verificação por evidência (build e lint limpos; suíte 136/136 via node --test). A seção Evidências necessárias foi acrescentada ao bloco de tarefa do template _shared/tasks.md (agora com os campos do RF-010), sincronizada entre o plugin-fonte e a cópia embutida na extensão — diff confirma os dois idênticos e check-templates valida o manifesto (SCN-TEVF-002). O teste de regressão TEST-TEVF-001 (tasksTemplate.test.ts) verifica a presença da seção via regex e falharia sem a correção (SCN-TEVF-001); nenhum teste existente foi alterado (contagem 129 para 136). Q1 resolvida na spec; sem bloqueio.

# null significa NÃO APROVADO. Preenchido por /sdd-kit:approve com
# {date, by, revision}.
approval: null

# Bloqueios ativos. Lista vazia significa sem bloqueio.
blocked_by: []

# Questões já resolvidas.
resolved_questions:
  - question: Q1
    date: "2026-08-02"
    resolved_by: spec
    summary: >-
      Formato do campo decidido pelo autor: seção de conteúdo
      `### Evidências necessárias` (como Descrição/Testes/Critério), não metadado.

# Contadores derivados de tasks.md. total = pending + in_progress + done.
tasks:
  total: 1
  pending: 0
  in_progress: 0
  done: 1
